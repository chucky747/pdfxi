[workspace]
resolver = "3"
members = [
    "crates/pdfxi-core",
    "crates/pdfxi-document",
    "crates/pdfxi-render",
    "crates/pdfxi-text",
    "crates/pdfxi-edit",
    "crates/pdfxi-forms",
    "crates/pdfxi-security",
    "crates/pdfxi-convert",
    "crates/pdfxi-standards",
    "crates/pdfxi-automation",
    "crates/pdfxi-accessibility",
    "crates/pdfxi-cli",
    "crates/pdfxi-app",
    "crates/pdfxi-assistant",
    "crates/pdfxi-testkit",
    "xtask",
]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["PDFXI contributors"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"

# Workspace members. Each entry carries both the path and an explicit version so
# member manifests inherit a versioned requirement (`{ workspace = true }`) and
# the `cargo deny` bans check never sees a wildcard path dependency.
# Only crates another member already depends on are listed: cargo warns about an
# unused workspace dependency, and binaries with no dependents (`pdfxi-app`,
# `pdfxi-cli`) plus crates nobody uses yet (`pdfxi-edit`) would trip it. Add the
# entry with the first dependent.
pdfxi-accessibility = { path = "crates/pdfxi-accessibility", version = "0.1.4" }
pdfxi-assistant = { path = "crates/pdfxi-assistant", version = "0.1.4" }
pdfxi-automation = { path = "crates/pdfxi-automation", version = "0.1.4" }
pdfxi-convert = { path = "crates/pdfxi-convert", version = "0.1.4", default-features = false }
pdfxi-core = { path = "crates/pdfxi-core", version = "0.1.4" }
pdfxi-document = { path = "crates/pdfxi-document", version = "0.1.4" }
pdfxi-forms = { path = "crates/pdfxi-forms", version = "0.1.4" }
pdfxi-render = { path = "crates/pdfxi-render", version = "0.1.4" }
pdfxi-security = { path = "crates/pdfxi-security", version = "0.1.4" }
pdfxi-standards = { path = "crates/pdfxi-standards", version = "0.1.4" }
pdfxi-testkit = { path = "crates/pdfxi-testkit", version = "0.1.4" }
pdfxi-text = { path = "crates/pdfxi-text", version = "0.1.4" }

[profile.dev]
debug = 1
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.fast]
inherits = "dev"
debug = 0
incremental = true

[profile.full]
inherits = "dev"
debug = 1
incremental = false

