id = "STD-002"
notes = """
Classic xref tables and xref streams are fully parsed and merged newest-wins
across /Prev chains with cycle detection. Hybrid /XRefStm files now parse the
companion xref stream at the same revision; its entries supersede the classic
placeholders. /W widths are validated (per field <= 8, sum 1..=16), /Index
subsections and /Size fallback are bounded, and a typed public report exposes
section kind, entries and /Prev pointer via inspect_xref and
Document::xref_report. FlateDecode with PNG predictors handles compressed
xref data, and type-2 entries resolve /ObjStm members through the bounded
parser reader. Ten new tests cover widths 1-4, multiple /Index subsections,
compressed retrieval, mixed /Prev chains, hybrid fallback and cycle, bad and
out-of-range widths/offsets/indexes, predictor, and a writer round-trip.

Row stays in-progress: general xref-stream *writing* for Document::save /
save_incremental is not implemented by this task; only the pre-existing
object-stream writer produces xref streams, and classic save paths still
decline stream-based sources.
