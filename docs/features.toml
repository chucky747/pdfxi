id = "VIEW-018"
notes = """
Window-free loupe magnifier model. LoupeModel supports circular and rectangular
lenses (LensShape), a zoom clamped to 1.0..=16.0 (MIN/MAX_LOUPE_ZOOM) with
NaN/infinity sanitization and try_set_zoom typed error, page/screen coordinate
mapping via exact inverses (page_to_screen / screen_to_page), source_rect (page
space, size lens/zoom) and dest_rect (screen space) whose corners map round-trip,
and deterministic half-open rectangle / radius-based circle hit-testing in both
spaces. Gesture navigation consumes caller-supplied Drag/Scroll/Pinch deltas
(no OS gesture recognizer): each step is bounded to MAX_GESTURE_STEP, drag is
accumulated up to MAX_GESTURE_ACCUM, panning divides by zoom and clamps the page
centre to page bounds, and pinch scales zoom within bounds. LoupeError reports
invalid geometry/zoom. No new deps, unsafe, or non-test panics.

Honest scope: pure model only. No native pointer/scroll/pinch event capture, no
OS window, and no rendering of the magnified raster — the host must feed deltas
into `apply` and draw dest_rect. Hence `in-progress` per ADR 0008.
"""
