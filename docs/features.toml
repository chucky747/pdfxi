id = "VIEW-017"
notes = """
T-0042 completes the text half of VIEW-017. With the `pdfium` feature,
`PdfiumRenderer` now implements `pdfxi_text::TextExtractor`. It takes the same
process-wide PDFium mutex as `render_page` for the whole load -> page -> text ->
character-copy sequence, visits characters in the order PDFium returns them,
and preserves that order verbatim (documented as PDFium's text-page order,
which follows the document's text operators for ordinary PDFs). Consecutive
characters sharing a baseline, font size, direction, and near-adjacent boxes
are merged into `TextSpan`s whose text, box (x/y/width/height in PDF page
points), baseline, font size, and direction are populated.

`TextSpan` gained a documented `direction_degrees` field and `with_direction`
builder; ordinary horizontal text is 0.0. No dependency cycle is introduced:
`pdfxi-text` depends only on `thiserror` and never on `pdfxi-render`, so
`pdfxi-render` now has a one-way path dependency on it.

A new private, native-free `text_extract` module owns span merging and box
normalization. Reversed and non-finite coordinates are normalized to finite,
non-negative metrics, so malformed glyph geometry cannot panic or leak NaN
into search/selection. The PDFium backend checks cancellation before any
native work and between characters, reports four progress stages, and returns
structured `TextError` variants for out-of-range pages and backend failures;
characters without a Unicode mapping or with failing metrics are skipped
rather than aborting the page.
"""
