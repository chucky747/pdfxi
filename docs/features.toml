CARGO_TARGET_DIR=target/lanes/render, PDFIUM_PATH=C:\Users\cmabr\AppData\Local\pdfxi\pdfium\bin\pdfium.dll.
cargo test -p pdfxi-render: 42 unit passed + 0 integration (0 tests in 3 feature-gated harnesses) + 0 doc tests, 0 failed, EXIT=0.
cargo test -p pdfxi-render --features pdfium: 42 unit passed + 12 integration passed (pdfium_backend 4, pdfium_text 6, thumbnail_pdfium 2) + 0 doc tests, 0 failed, EXIT=0.
cargo fmt -p pdfxi-render -- --check: EXIT=0.
cargo clippy -p pdfxi-render --all-targets --all-features -- -D warnings: EXIT=0.
cargo doc -p pdfxi-render --no-deps with RUSTDOCFLAGS=-D warnings: EXIT=0.
'''
id = "VIEW-001"
notes = """
T-0049 adds a dependency-free `print` module to pdfxi-render. It defines a
validated `PrintSettings` job model (page selection: all/single/inclusive
range/explicit list; copies; fit/actual/custom-percent scale; orientation;
duplex; named paper; margins; target DPI) with structured `PrintError`
variants. `parse_page_ranges` parses 1-based expressions such as "1-3,5,7-",
supports open spans, suppresses duplicates, sorts results, and rejects
malformed/out-of-range/zero input with stable errors. `PrintJob` resolves a
selection against a page count into a sorted, deduplicated, copy-expanded
(page-major) list; `PrintJob::from_pages` accepts already-parsed zero-based
indices. `PrintSpooler::spool` renders through `&dyn Renderer` at the chosen
scale (measuring once at scale 1.0 for Fit), checks cancellation before the
first page and between pages, reports whole-raster progress, and returns
`PrintPage { page, width_px, height_px, rgba, dpi }` rasters plus a stable
`SpoolSummary { pages, first_page, last_page, total_pixels }`.

This produces rasters only; handing them to a platform printer is explicitly a
later adapter and is why VIEW-001 remains in-progress. All public items have
rustdoc, the crate denies missing docs and forbids unsafe code, and non-test
code uses no unwrap/expect/panic.
"""
priority = "P0"
status = "in-progress"
tests = [
