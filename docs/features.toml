translates a block's Tm/Td placement or an image's placement cm; `resize_object`
scales an image's cm axes about its origin or scales a text block through its
Tf sizes, Tm horizontal term and Td spacing while keeping the text extractable;
`replace_object` rebuilds a text block through the T-0233 reflow/font path or
swaps an image XObject's stream and dictionary in place; `delete_object` removes
the block's BT..ET text objects or the image Do usage and unlinks only an
unshared single-use XObject. Shared text objects, shared placements, shared
image resources, image draws in text objects and unsupported transforms fail
closed. Every operation is copy-on-write through the core Document (callers use
a pdfxi-document session for undo/redo) and is proven by PDFium: resized text
kept a 1.505 x 1.500 ink ratio about its origin, shrunk images vacated the old
band (0 red), replacement images painted blue with 0 old red pixels, and
replacement text extracted instead of the original. Full suite 355 passed;
fmt/clippy/doc clean. Round B limits: images in Form XObjects and inline images
are out of scope; text resize refuses rotated or Td-only objects; image replace
