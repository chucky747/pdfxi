id = "STD-003"
notes = """
Verified through two CLI hosts over the existing core writers.

`pdfxi linearize <FILE> --out PATH [--version 1.7] [--json]` calls
Document::save_linearized, reopens the output, reads the /Linearized dictionary
and rejects it unless the declared /L equals the written byte count, /N equals
the page count and the hint range lies inside the file; it then compares every
page's text with the source and reports first-page object, first-page-section
end, main xref offset and hint range.

`pdfxi pack <FILE> --out PATH [--no-compress] [--max-objects N] [--json]` calls
Document::save_with_object_streams with the requested compression and /ObjStm
member limit (validated 1-65535), reopens the output, requires both an /ObjStm
and a /XRef stream, and compares every page's text with the source.

Evidence: minimal.pdf linearizes to 1001 bytes with declared_length 1001, one
verified text page, first_page_object 3, hint at 207/80; the real Excel hybrid
fixture linearizes to 94030 bytes with declared_length 94030 and two verified
text pages. Two runs over powerpoint-slides.pdf are byte-identical. Packing
minimal.pdf gives 595 -> 731 bytes with object_streams and xref_stream true, and
the Excel fixture 92366 -> 92946; pdfxi info reports 2 pages and pdfxi text
extracts the same text as the source.

Gates: cargo test -p pdfxi-cli --test cli linearize = 2 passed; whole workspace
fmt/clippy/tests green.

Scope: linearized and object-stream/xref-stream full output are reachable and
verified for text and page structure; incremental object-stream appends remain a
core API exercised by unit tests rather than a separate command.
"""
