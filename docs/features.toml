id = "EDIT-003"
notes = """
Adds a dependency-free document-wide find/replace model in pdfxi-edit.
`SearchOptions` carries case_sensitive, whole_word and diacritic_insensitive
flags; matching is literal Unicode-scalar comparison with a bounded, one-to-one
case fold and a documented diacritic fold (common precomposed Latin letters
plus combining-mark ranges). There is no regex engine and no pattern syntax, so
arbitrary regular expressions are never executed and work is bounded by
query_len x text_len per line. `SearchDocument` / `SearchPage` take
caller-supplied extracted text; `find_all` returns `SearchHit`s with page, line
and half-open scalar offsets, sorted by (page, line, start) so results are
deterministic even when input pages are out of order. `build_replace_all_plan`
emits a `ReplaceAllPlan` of `ReplaceStep`s chosen leftmost-first with no
overlaps, a configurable replacement cap, and typed `FindReplaceError` variants
for empty query, oversized query/line/replacement, invalid options and cap
exceeded. This is verified at the library-model level: this crate never reads
or rewrites content streams, so host serialization of the plan and UI wiring
remain future work. No new dependency and no source-byte mutation.
"""
