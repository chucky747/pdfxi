evidence = '''CARGO_TARGET_DIR=target/lanes/app; PDFIUM_PATH=C:\Users\cmabr\AppData\Local\pdfxi\pdfium\bin\pdfium.dll. cargo test -p pdfxi-app --features ui,pdfium: 58 passed, 0 failed; raster::tests::pdfium_raster_fills_cache_with_non_uniform_pixels opened fixtures/minimal.pdf with PdfiumRenderer, rendered page 0 at scale 1.0 (non-zero width/height, pixels.len() == width*height*4), then filled the app RasterCache and asserted a non-uniform raster (the 'Hello, PDFXI!' text). ui::tests::demo_fixture_fills_the_cache_without_a_window verified the demo tab takes its one-page count from the fixture and that ensure_rasters fills the cache. Also cargo test -p pdfxi-app: 42 passed; --features ui: 56 passed; clippy/fmt/doc clean.'''
id = "VIEW-016"
notes = """
End-to-end open/render slice. `pdfxi-app` now depends on `pdfxi-render` and its
`pdfium` feature forwards to `pdfxi-render/pdfium`. `PdfxiApp::new()` opens
fixtures/minimal.pdf through `PdfiumRenderer` when `pdfium` is enabled (failures
are reported through status, never panics). `CanvasLayout` drives
`RasterCache::ensure_visible`, which renders the visible pages at the resolved
canvas scale into an LRU cache; `raster_texture` uploads the cached RGBA page
into a reusable egui texture that `canvas_ui` paints inside the page rectangle.
The cache and its tests are GUI-free and run under default features with a mock
renderer. Fixture resolution is documented in `raster::workspace_fixture_path`:
CARGO_MANIFEST_DIR for pdfxi-app is crates/pdfxi-app, so the workspace root is
two levels up.
"""
