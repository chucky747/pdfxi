[[feature]]
docs = [
    "crates/pdfxi-convert/src/html_export.rs",
    "crates/pdfxi-convert/src/lib.rs",
    "docs/evidence/convert/T-0110.md",
]
domain = "Export"
evidence = "cargo test -p pdfxi-convert (CARGO_TARGET_DIR=target/lanes/convert): 11/11 new html_export tests pass (162 unit + 12 integration total, 0 failed); fmt --check, clippy --all-targets --no-deps -D warnings, and rustdoc -D warnings all EXIT=0. See docs/evidence/convert/T-0110.md."
id = "EXPORT-004"
notes = """
T-0110 adds a dependency-free HTML writer in crates/pdfxi-convert/src/html_export.rs.
It consumes a caller-supplied HtmlDocument (pre-extracted, positioned text) and emits
inert, deterministic HTML with absolutely positioned spans. PDF bottom-left
coordinates are inverted to CSS top-left (top = page_height - (y + height); 1 pt = 1 px).
Text is escaped for element content and attributes; pages and links are sorted; output
is byte-stable. A navigation index anchors pages in single-file mode, while page-set
mode yields index.html plus page-NNNN.html files. Links allow only relative, http,
https, mailto and #anchor targets; javascript: and other active schemes are typed errors.
Images are only referenced when the caller supplies a bare, already-extracted raster
filename (png/jpg/jpeg/gif/webp/bmp); traversal, separators, URI/drive schemes and SVG
are rejected, and no bytes are fetched or embedded. No script elements or event handlers
are emitted. Typed HtmlExportError variants cover empty/oversized input, duplicate pages,
bad geometry and non-finite coordinates, unknown link pages, disallowed schemes and
unsafe image references. Bounded constants prevent unbounded allocation; no new
dependencies, no unsafe, and no unwrap/expect/panic in non-test code.

Honest caveat: the writer does not extract text from PDF bytes or dispatch through
ExportKind::Html / the CLI in this task, so EXPORT-004 remains in-progress.
"""
