evidence = "docs/evidence/app/T-0161.md: 11 new reflow::tests pass; cargo test -p pdfxi-app 343 passed/0 failed, cargo test -p pdfxi-app --features ui 406 passed/0 failed; fmt/clippy --all-targets --all-features --no-deps/doc EXIT=0."
id = "VIEW-013"
notes = """
Adds `pdfxi_app::reflow`, a window-free reflow view model. Caller-supplied
`TextBlock`s (page, reading order, text) are wrapped into a deterministic
`ReflowLayout` of `ReflowLine`s grouped into `ReflowBlock`s for a fixed-point
`FontMetric` (integer hundredths of a point, so line breaks are byte-identical
on every host). The layout exposes page navigation (`page_indices`,
`first_line_for_page`, `next_page`, `previous_page`, `page_at_offset`), scroll
clamping (`clamp_scroll`), and a `ReadAloudCursor` that maps canonical character
