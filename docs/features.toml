id = "CREATE-013"
notes = """
Adds `pdfxi_convert::postscript_ingest`: a bounded, dependency-free DSC reader.
It parses %%BoundingBox, %%Pages, %%Page, %%Trailer and %%EndComments; detects
EPS from an EPSF header token or a bounding box with no %%Page markers; orders
pages by ascending %%Page ordinal; and extracts a documented minimal operator
subset (moveto/rmoveto, lineto/rlineto, newpath, closepath, rectfill/
rectstroke, fill/stroke limited to straight two-point lines and axis-aligned
rectangles, show with escaped literal strings, and findfont/scalefont/setfont)
into the crate's existing PsContent vector/text model. Input is bounded before
parsing (8 MiB bytes, 200k lines, 10k pages, 200k tokens/page, 256 stack slots,
512 findings, 8192 chars/text). Everything else is reported, not guessed: a
deterministic PsIngestReport carries stable kind/reason findings per page, and
strict mode promotes them to a typed PsIngestError::Unsupported. Binary
%%BeginData/%%BeginBinary sections are a typed error.

Honest remaining scope: no full Turing-complete PostScript interpreter; no
general graphics-state, CTM/transform, clipping, or color modeling; no Bezier
path approximation; no raster image decoding or image/font embedding; no CID or
keyed font handling; no DSC (atend) resolution across %%Trailer; no %%Include*
resource following; no external Distiller/Ghostscript process; and no CLI/UI
entry point. The row therefore stays in-progress, not replaced.
"""
