id = "STD-004"
notes = """
Verified through `pdfxi font add-text <FILE> --out PATH --text T --rect x0,y0,x1,y1
[--page N] [--font-size PT] [--align left|center|right] [--json]`.

The command calls pdfxi_edit::add_text_box, which embeds the bundled Courier
Prime program (SIL OFL 1.1) as a /Type0 font with a /CIDFontType2 descendant,
/FontFile2, /CIDToGIDMap, CID-keyed /W widths and a /ToUnicode CMap via
pdfxi_core::font::stage_cid_font, and appends a content stream using the page
resource. It wraps to the box and supports left/center/right alignment.

After saving, the host reopens the bytes and verifies the named page font
resource is /Subtype /Type0, /DescendantFonts[0] is /CIDFontType2, the descriptor
carries /FontFile2 (or FontFile3/FontFile), the Type0 dictionary has /ToUnicode,
and every inserted word is present in the extracted page text. Resolution walks
the page /Parent chain when /Resources is inherited. It fails rather than
silently writing unsearchable text.

Evidence: minimal.pdf yields resource FXF0, base font CourierPrime, Type0 object
6, descendant CIDFontType2, font_file and to_unicode true, 4/4 words found; the
authoring page-boxes fixture works with center alignment and 4/4 words. pdfxi
text on both outputs returns the inserted words, and two runs are byte-identical.
Bad input (blank text, unknown alignment, off-page rectangle, page 0) is rejected.

Gates: cargo test -p pdfxi-cli --test cli font_add_text = 2 passed; cargo test
-p pdfxi-cli --bin pdfxi font:: = 1 passed; whole workspace fmt/clippy/tests
green.

Scope: the bundled TrueType program is embedded as a full CID font (no binary
subsetting), one font per text box, horizontal text only; arbitrary caller
programs and subsetting remain library-level.
