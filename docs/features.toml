Windows-style caption buttons (minimize, maximize/restore, close) at the right of the
custom title bar, with macOS traffic lights available as a persisted setting. A gear
popup selects Theme (Light/Dark/Follow system) and Window controls (Windows/macOS) and
saves both. --controls=windows|macos and --dark/--light override the saved settings for
