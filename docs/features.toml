[[feature]]
docs = "crates/pdfxi-edit/src/pdf/mod.rs"
domain = "Review"
evidence = "cargo test -p pdfxi-edit (CARGO_TARGET_DIR=target/lanes/author): exit 0, 30 passed, 0 failed, 0 ignored; 0 doc tests. cargo fmt -p pdfxi-edit -- --check: exit 0. cargo clippy -p pdfxi-edit --all-targets --all-features -- -D warnings: exit 0, no warnings. Toolchain note: with rustc 1.100 merged doctests, any compiled doctest in this crate fails (even a trivial assert_eq); the module example is therefore a non-compiled text code fence, leaving `cargo test -p pdfxi-edit` green with 0 doctests. Reviewer sign-off and integrator snapshot remain external orchestration steps."
id = "REVIEW-001"
notes = """
Added a dependency-free `pdf` submodule to pdfxi-edit that maps the existing
annotation model to and from a small intermediate dictionary (BTreeMap of
string keys to scalar/array Value objects). It stays independent of the
pdfxi-core object model, as required by the crate boundary.

`serialize` covers the common entries /Subtype, /Rect, /Contents, /T, /NM, /M,
/C, /F, /CA, and /AP normal/rollover/down reference names, plus per-type
fields for Text, Highlight, Underline, StrikeOut, Squiggly, Square, Circle,
Line, Ink, FreeText, and Link. Four documented extension keys (XI_Id, XI_Page,
XI_Alpha, XI_FontSize) make Annotation -> Dict -> Annotation lossless for all
sixteen existing AnnotationKinds. Unknown subtypes are preserved as
PdfSubtype::Opaque together with every unmodelled dictionary entry; conversion
back to the older Annotation model reports PdfError::UnknownSubtype rather than
dropping data.

Validation is structured via PdfError: rectangle normalization pairs corners
in any order and rejects non-finite or degenerate extents, colour components
must be finite and in 0.0..=1.0, Line requires two /L points and Ink requires
at least one non-empty stroke.

`appearance` derives deterministic border paths (solid and dashed with fixed
clockwise traversal), centered text-note icon layout, and markup quads sorted
into a stable reading order (descending y, then ascending x). Repeated calls
and scrambled quad inputs produce identical geometry; source annotations are
never mutated. Reading-order interaction is unchanged because this module
does not depend on pdfxi-accessibility.

Geometry gained infallible Rect::saturating and Rect::inset helpers so no
non-test code needs unwrap/expect/panic. Public items carry rustdoc, the crate
keeps #![forbid(unsafe_code)] and #![deny(missing_docs)].
"""
priority = "P0"
status = "verified"
tests = [
