cargo fmt -p pdfxi-app -- --check: EXIT=0.
cargo clippy -p pdfxi-app --all-targets --all-features -- -D warnings: EXIT=0 (clean).
"""
id = "VIEW-017"
notes = """
T-0040 completes the UI half of VIEW-017. A new dependency-light `find` module
(no egui types, no pdfxi-text dependency, default = [] unchanged) exposes
FindState with query/options/results/current-index, set_query, set_options,
next_match/previous_match with deterministic wrap-around, current(), and
match_summary() ("n of m", with a trailing + when the documented 10,000-match
cap truncates). Matching uses Unicode-scalar character offsets, ASCII-only case
folding, whole-word boundaries, leftmost-first non-overlapping results, and
page-index sorting for supply-order independence.

ui.rs (behind `ui`) adds a find bar (query field, Match case / Whole word
toggles, Previous / Next, "n of m" summary, Close/Escape) opened with Ctrl+F;
F3 / Shift+F3 navigate. Matches are highlighted on the canvas page rectangles
(the current match gets a stronger fill and outline), and the view scrolls to
the current match via a pure, clamped scroll helper when a layout is available.
A text selection is shown in the status line and copied through egui's
Context::copy_text on Ctrl+C. Highlight geometry, find-page construction, and
scroll targeting are pure, window-free helpers with unit tests.

Demo page text: pdfxi-render exposes only rasters (no text_page method), and a
direct pdfxi-core/pdfxi-text dependency would break the dependency-light default
build and touch the shared Cargo.lock. The demo viewer therefore feeds the same
synthetic OwnedTextPage text it displays into both find and selection copy, so a
highlighted match is exactly the text a user can select and copy. A production
loader can supply real extracted text through FindState::set_pages.
"""
