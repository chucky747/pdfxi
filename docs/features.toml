current CTM intersects a mark is decoded and rewritten with the same glyph and
image logic, nested forms are followed to 16 levels with cycle and visit caps,
and a rewritten form is staged copy-on-write. `UnsupportedForm` fails closed on
a cycle, depth/visit overflow, undecodable form stream or unsupported filter.
`keep_images = true` reports an intersecting form as a survivor. Unresolved Do
names and unsupported non-form XObjects stay fail-closed. Form vector graphics
are not removed, matching page content. Inline images (BI/ID/EI) remain
fail-closed (Round B), and no app shell is exposed.
