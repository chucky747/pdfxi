domain = "View & Navigate"
evidence = '''
CARGO_TARGET_DIR=target/lanes/app; PDFIUM_PATH=C:\Users\cmabr\AppData\Local\pdfxi\pdfium\bin\pdfium.dll.
cargo test -p pdfxi-app 2>&1: 69 unit tests passed, 0 failed, EXIT=0 (doc-tests 0 passed).
cargo test -p pdfxi-app --features ui 2>&1: 95 unit tests passed, 0 failed, EXIT=0 (bin 0, doc-tests 0).
cargo test -p pdfxi-app --features ui,pdfium 2>&1: 97 unit tests passed, 0 failed, EXIT=0 (bin 0, doc-tests 0).
cargo fmt -p pdfxi-app -- --check: EXIT=0.
cargo clippy -p pdfxi-app --all-targets --all-features -- -D warnings: EXIT=0 (no warnings).
All three test configurations compiled with zero warnings; default and ui-only builds do not link PDFium.
'''
id = "VIEW-007"
notes = """
Added `pdfxi-app::thumbs`, a dependency-light (no egui) navigation-pane model. `ThumbnailPaneState` owns per-page `ThumbnailMeta` (page, row, Idle/Queued/Ready status), a scroll offset, visible-row math, active and selected pages, a bounded prefetch request queue, and pdfxi-render's LRU `ThumbnailCache`. `visible_range_for` computes the half-open visible row range from scroll, row height, viewport height, and page count with boundary/degenerate handling; `page_at_row`/`row_for_page` are inverse identity maps with bounds checks for the single-column list; `page_at_offset` maps a pane offset to a page. `prefetch_range` widens the visible range by a documented per-side row margin; `enqueue_visible` fills a capacity-bounded FIFO queue, skipping cached and already-queued pages (dedupe) and dropping the oldest request when full; `generate_pending` drives `ThumbnailCache::generate` through the `Renderer` trait with cancellation and progress forwarding. `generate_page`/`cached_thumbnail` provide the immediate/cached fetch paths, and `clear_cache`/`reset` drop document-scoped state. All public items have rustdoc; no non-test unwrap/expect/panic.

`ui.rs` adds an egui `SidePanel::left` with a scrollable list of one tile per page. With `pdfium`, visible thumbnails are enqueued and generated at most four per frame through the shared cache and uploaded into reusable `egui::TextureHandle`s; without it the tiles are drawn as placeholders. Clicking a tile calls `PdfxiApp::select_thumbnail_page`, which marks the page active, updates the tab's current page, highlights the tile, and requests a canvas scroll to that page (applied via `scroll_offset_for_page`). Canvas scrolling calls `sync_active_page_from_canvas`, which uses the pure `active_page_from_canvas_scroll` helper so the active tile follows the viewport; an unchanged frame is a no-op that leaves manual pane scrolling alone. The pane viewport height is reported from the side panel each frame, and ScrollArea's actual offset feeds the next frame's visible range. `default = []` and `ui` still build without PDFium.

Window-free tests cover short/long visible ranges, boundary page/row mapping and empty documents, page-at-offset clamping, prefetch expansion and clamping, request dedupe/capacity/metadata, active-page tracking and click selection, reset/clear semantics, generation through a counting mock renderer (two render phases per miss), repeated-query cache reuse, cancellation, and the pure canvas-scroll-to-active helper.
"""
priority = "P0"
status = "verified"
tests = [
    "thumbs::tests::visible_range_short_document_shows_all_pages",
    "thumbs::tests::visible_range_long_document_tracks_scroll_offset",
    "thumbs::tests::visible_range_empty_and_degenerate_inputs_are_safe",
    "thumbs::tests::visible_range_method_uses_pane_state",
    "thumbs::tests::page_row_mapping_boundaries_are_inverse",
    "thumbs::tests::page_at_offset_clamps_to_document",
    "thumbs::tests::prefetch_range_expands_visible_range_and_clamps",
    "thumbs::tests::enqueue_visible_deduplicates_and_is_bounded",
    "thumbs::tests::enqueue_marks_metadata_queued_and_dedupes_across_scroll",
    "thumbs::tests::active_page_tracking_clamps_and_reports_changes",
    "thumbs::tests::select_page_on_click_sets_active_and_selected",
    "thumbs::tests::reset_clears_all_document_scoped_state",
    "thumbs::tests::generate_pending_uses_renderer_and_marks_ready",
