id = "EDIT-008"
notes = """
Verified through a new writer operation and a CLI host. `PageOperation::Stamp`
and `StampPages` append an overlay content stream to each targeted page and merge
the overlay's fonts and /ExtGState entries into a direct copy of the page's
resource dictionary under names the page does not already use, rewriting the
overlay's resource tokens to match; the stamp is therefore ordinary page content
(rendered, searched, extracted) and a page that already used /F1 keeps its font.
`Document::page_frame(index)` exposes the media box and effective rotation the
overlay renderers need.

`pdfxi decorate header-footer <FILE> --out PATH [--header TEXT] [--footer TEXT]
[--side left|center|right] [--font-size N] [--margin N] [--title T] [--date D]
[--json]` renders the pdfxi-edit six-slot layout per page and stamps it. Templates
accept {page}, {pages}, {date}, {title} and {filename}; an unknown placeholder is
a typed error.

Evidence on fixtures/realworld/powerpoint-slides.pdf: three pages stamped with
header "Quarterly Review" and footer "Page {page} of {pages}"; pdfxi text shows
