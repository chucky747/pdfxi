[[feature]]
docs = "crates/pdfxi-render/src/pdfium_backend.rs"
domain = "View & Navigate"
evidence = 'cargo test -p pdfxi-render --features pdfium (CARGO_TARGET_DIR=target/lanes/render, PDFIUM_PATH=C:\Users\cmabr\AppData\Local\pdfxi\pdfium\bin\pdfium.dll): 5 unit passed + 4 integration passed, 0 failed, EXIT=0. cargo test -p pdfxi-render (default): 5 unit passed, 0 failed, EXIT=0. cargo fmt -p pdfxi-render -- --check: EXIT=0. cargo clippy -p pdfxi-render --all-targets --features pdfium -- -D warnings: EXIT=0. Installed PDFium FileVersion=160.0.8165.0 (pdfium-render 0.9.5 default pdfium_8125 bindings).'
id = "VIEW-001"
notes = '''
Added an optional `pdfium` feature and optional pdfium-render 0.9.5 dependency;
default builds stay dependency-light (`default = []`) and compile the backend
out entirely. PdfiumRenderer binds the native library from PDFIUM_PATH, then
%LOCALAPPDATA%\pdfxi\pdfium\bin\pdfium.dll, the current directory, and finally
the system search path. It loads a document from bytes or a file, implements
Renderer::render_page/page_count, and returns tightly packed RGBA at the
requested scale (1.0 == 72 DPI) via PdfRenderConfig::scale_page_by_factor.
PDFium is not thread-safe, so one process-wide Pdfium instance is held behind a
Mutex and that lock is kept for the whole load/get-page/render/copy sequence;
a documented bounded pool of one. Invalid scale, out-of-range page, cancelled
tokens, missing files, and malformed documents all return structured
RenderError variants without panicking. Progress is reported as work advances.
This is the backend POC only: app tile/canvas wiring, printing, and golden SSIM
comparison remain future tasks, hence in-progress.
'''
priority = "P0"
status = "in-progress"
tests = [
    "tests/pdfium_backend.rs::renders_minimal_pdf_page_zero_at_scale_one",
    "tests/pdfium_backend.rs::invalid_document_returns_structured_error",
    "tests/pdfium_backend.rs::missing_file_returns_structured_error",
    "tests/pdfium_backend.rs::invalid_inputs_are_rejected_without_panicking",
]
title = "Open and print PDF documents"

