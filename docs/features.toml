[[feature]]
docs = "crates/pdfxi-core/src/lib.rs"
domain = "Standards"
evidence = "cargo test -p pdfxi-core (CARGO_TARGET_DIR=target/lanes/core): 9 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out. cargo clippy -p pdfxi-core --all-targets -- -D warnings: clean. cargo fmt -p pdfxi-core -- --check: clean."
id = "STD-001"
notes = "Header validation and version extraction are retained from T-0006 and now feed an eager structural parse. Classic-table PDFs from 1.0 through 1.4 parse (including /Prev chained sections for incremental updates); version-dependent features such as xref streams (1.5+) and 2.0 constructs are not yet implemented, so full 1.0-2.0 compatibility stays in-progress."
priority = "P0"
status = "in-progress"
tests = [
    "pdfxi_core::tests::accepts_pdf_header_and_reads_version",
    "pdfxi_core::tests::rejects_non_pdf_input",
    "pdfxi_core::tests::parses_one_page_pdf_from_testkit",
    "pdfxi_core::tests::parses_multi_page_pdf_and_preserves_order",
]
title = "PDF 1.0 through 2.0 compatibility"

[[feature]]
docs = "crates/pdfxi-core/src/parser.rs"
domain = "Standards"
evidence = "cargo test -p pdfxi-core (CARGO_TARGET_DIR=target/lanes/core): 9 passed; 0 failed; 0 ignored; 0 measured; 0 filtered out. cargo clippy -p pdfxi-core --all-targets -- -D warnings: clean. cargo doc -p pdfxi-core --no-deps: success."
id = "STD-002"
notes = "Classic xref tables are fully parsed: final startxref lookup, subsection headers, n/f entries, trailer dictionary, /Root, and /Prev chains with newest-wins merging and cycle detection. The /Pages tree is walked recursively with cycle guards and inherited MediaBox/Resources; /Count, leaf page MediaBox and /Contents references are exposed via Document::page_count, page, pages, root, trailer_size and declared_page_count. All parsing is bounds-checked with thiserror variants and no non-test panics. Xref streams are explicitly out of scope for this task and keep the row in-progress."
priority = "P0"
status = "in-progress"
tests = [
    "pdfxi_core::tests::parses_one_page_pdf_from_testkit",
    "pdfxi_core::tests::parses_multi_page_pdf_and_preserves_order",
    "pdfxi_core::tests::rejects_missing_xref",
    "pdfxi_core::tests::rejects_bad_startxref",
    "pdfxi_core::tests::rejects_malformed_xref_entry",
    "pdfxi_core::tests::rejects_missing_root_and_pages",
    "pdfxi_core::tests::rejects_invalid_media_box_and_page_tree_cycle",
]
title = "Cross-reference tables and streams"

