Verified through a new pdfxi export conformance host over
pdfxi-convert::conformance. Profiles PDF/A-1b, PDF/A-2b, PDF/A-3b, PDF/X-1a,
PDF/X-4 and PDF/E-1 resolve from canonical labels or compact lowercase
spellings (pdfa-2b, pdfx-4, pdfe-1). --plan prints the byte-free ConformancePlan
with enforced and report-only steps and writes nothing. Exports normalize the
header version, add the required XMP and output-intent placeholders (each
switchable off), detect forbidden catalog entries under --policy report and fail
before writing under --policy reject, validate an explicit --output-intent
subtype against the target, and rewrite the xref deterministically.

Before writing, the host reopens the normalized bytes with pdfxi-core and checks
the page count and every page's text against the source, the header version
against the target minimum, /Metadata when the target requires XMP and
/OutputIntents when it requires an output intent. The report always states
certification_claimed=false and prints the stable scope note; the XMP and ICC
streams are placeholders and every other constraint is reported only.

Evidence: the PDF/A-2b plan lists 7 steps (4 enforced, 3 report-only);
minimal.pdf normalizes with pages_verified 1 and the four enforced families plus
EXPORT.XMP_PLACEHOLDER_ADDED and EXPORT.OUTPUT_INTENT_PLACEHOLDER_ADDED warnings;
pdfxi text matches before and after. PDF/X-4 on the authoring fixture works the
same way, and PDF/E-1 enforces only minimum_version. A PDF/E-1 request with
GTS_PDFA1 is a typed contradictory-request error. A catalog carrying
/JavaScript is refused under --policy reject ('PDF/A-1b' forbids catalog entry
/JavaScript) and reported as present_forbidden_entries ["/JavaScript"] under
report.

