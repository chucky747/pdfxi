id = "VIEW-017"
notes = """
Multi-page SearchIndex (ordered by page then character offset, case-insensitive, whole-word, documented leftmost-first overlap policy), TextSelection with two-way normalization and cross-page copy, plain-text span offsets, and shared boundary rules.

T-0033 adds a headless consumer of that index: `pdfxi search <FILE> <QUERY> [--case-sensitive] [--whole-word] [--json]`. For each page it builds one TextPage from `pdfxi_core::page_text` with the page's entire extracted text in a single TextSpan, so reported offsets are zero-based Unicode-scalar (character) offsets into each page's concatenated text -- the same offset space `pdfxi-text` documents. Results are sorted by page then offset by SearchIndex. Text mode prints `page N offset M matched text`; --json emits stable fields `file`, `query`, and `matches` with `page`/`offset`/`text` per match. --case-sensitive and --whole-word map directly to SearchOptions. No-match is deliberately not an error: exit 0, zero stdout lines, and a `no matches` stderr note in both modes, so an empty result is never confused with a failure. Missing/unreadable files, invalid documents, and unsupported content filters produce non-zero exits with actionable, page-contextual stderr. The UI find bar and match highlighting are still unwired, so this row stays in-progress.
"""
