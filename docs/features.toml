id = "AUTO-005"
notes = """
T-0160 adds `pdfxi_automation::operation_registry`, the library-level model for
scripting every operation. `OperationRegistry::with_defaults` registers one
`OperationDescriptor` per `SUPPORTED_COMMANDS` entry, each with typed
`ParamDescriptor`s (`ParamType::{String,Bool,Integer,Path}`). Enumeration via
`names`/`operations` is deterministic alphabetical order. `resolve(&[String])`
parses `name=value` arguments, rejects empty input, unknown operations,
malformed/unknown/duplicate parameters, missing required parameters, and
invalid bool/integer values with typed `ResolveError`s, then produces a typed
`CallPlan` whose `arguments()` iterate in alphabetical key order and whose
`summary()` is byte-stable. Resolution performs no execution, filesystem,
network, or process access. All public items have rustdoc; no new dependency,
unsafe, or non-test panic. Honest remaining scope is outside this row's library
boundary: the CLI crate was NOT edited — this registry is the model a CLI
adapter can consume; exposing every descriptor through `pdfxi-cli` argument
parsing remains a separate CLI task. Prior T-0050 CLI action/droplet evidence is
retained below.
"""
