[[feature]]
docs = "crates/pdfxi-core/src/lib.rs"
domain = "Standards"
evidence = """
CARGO_TARGET_DIR=target/lanes/core; cargo test -p pdfxi-core: 66 passed; 0 failed; 0 ignored; 0 measured (doc-tests 0 passed).
cargo clippy -p pdfxi-core --all-targets --all-features -- -D warnings: EXIT 0, clean.
rustfmt --edition 2024 --check on crates/pdfxi-core/src/{lib,parser,writer,lexer}.rs: EXIT 0.
RUSTDOCFLAGS='-D warnings' cargo doc -p pdfxi-core --no-deps: EXIT 0.
Note: cargo fmt -p pdfxi-core -- --check still reports pre-existing diffs in
crates/pdfxi-core/examples/bench_open_500.rs, a file owned by another task;
it was not edited for this feature.
"""
id = "STD-010"
notes = """
Added dependency-free save support to pdfxi-core. Document::set_object stages a
replacement or new indirect object (copy-on-write; rejects object number 0 and
non-zero generations with Error::InvalidObjectId). Document::save serializes a
standalone PDF: it preserves object numbers and copies unchanged objects from
the source byte-for-byte via the xref offsets, so stream payloads (including
Flate data) are never re-compressed or rewritten; staged objects are encoded by
a new writer module. Regenerates a single classic xref table with grouped
subsections, a free object 0, the merged trailer with updated /Size and /Root,
startxref and %%EOF. Document::save_incremental keeps the original bytes as an
exact prefix, appends staged objects and a new xref section whose trailer /Prev
points at the original startxref, so reparse resolves the newest entries first.

Limitations: classic-table PDFs only. Encrypted documents (trailer /Encrypt)
and cross-reference-stream documents return Error::UnsupportedState rather than
panicking; malformed trailers surface the existing structured parse errors.
Non-zero object generations and non-finite reals are rejected. Object-stream
and linearization-hint support is provided separately by STD-003. Row stays
in-progress because digital preservation also covers validation, signing and
long-term packaging.
"""
priority = "P1"
status = "in-progress"
tests = [
    "tests::save_round_trips_minimal_fixture",
    "tests::save_round_trips_text_fixture",
    "tests::save_round_trips_multipage_fixture_in_order",
    "tests::save_preserves_object_numbers_and_compressed_stream_bytes",
    "tests::save_writes_staged_change_with_preserved_object_numbers",
    "tests::incremental_save_preserves_original_bytes_as_prefix",
    "tests::incremental_save_links_new_xref_to_previous_with_prev",
    "tests::incremental_save_changed_stream_is_visible_after_reparse",
    "tests::set_object_rejects_invalid_object_ids",
    "tests::save_rejects_encrypted_document_with_structured_error",
    "tests::save_rejects_xref_stream_with_structured_error",
    "tests::save_rejects_malformed_document_with_structured_error",
    "writer::tests::escapes_unsafe_name_bytes",
    "writer::tests::writes_hex_strings_and_integral_reals",
    "writer::tests::rejects_non_finite_reals",
    "writer::tests::stream_serialization_sets_exact_length",
    "writer::tests::xref_section_groups_consecutive_objects",
    "writer::tests::write_trailer_emits_expected_tail",
]
title = "Incremental update and digital preservation"

