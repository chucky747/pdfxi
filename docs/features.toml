id = "SEC-004"
notes = """
T-0143 completes the local digital-ID lifecycle. PrivateKeyPkcs8 validates a
caller-supplied PKCS#8 v1 shape (INTEGER 0, AlgorithmIdentifier, non-empty
OCTET STRING) and redacts its bytes in Debug. KeyCertificatePair checks the key
algorithm OID against the certificate SubjectPublicKeyInfo OID. DigitalIdLifecycleStore
is a BTreeMap keyed by label, so list(now) is sorted/deterministic and carries
caller-clocked validity (Expired / NotYetValid / Valid), subject/issuer display,
serial, certificate fingerprint, and key algorithm OID. import / import_exported
/ export / remove / rotate are all typed and leave the store unchanged on failure;
duplicate labels and duplicate certificate fingerprints are rejected. seal_store /
open_store wrap the whole store in a password-protected envelope built only from
the existing AES-256-CBC and SHA-256 primitives (local HMAC-SHA256 + iterated,
domain-separated key derivation); the salt is stored in the envelope, an IV is
derived from the key, the HMAC is checked in constant time, and a wrong password
is indistinguishable from tampering. No filesystem, network, or wall clock access.
Typed errors: DigitalIdKeyMalformed, DigitalIdKeyAlgorithmMismatch,
StoreEnvelopeMalformed, StoreEnvelopeIntegrityFailed, StoreEnvelopeVersionUnsupported.

