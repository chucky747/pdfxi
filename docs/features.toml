docs = "crates/pdfxi-convert/src/lib.rs"
domain = "Export"
evidence = "cargo test -p pdfxi-convert -p pdfxi-standards (CARGO_TARGET_DIR=target/lanes/convert): 22 convert unit tests passed, 0 failed; 0 doctests executed (doc examples are rendered as ```text blocks, not compiled or run, because the host denies generated doctest binaries with os error 5). cargo fmt -p pdfxi-convert -p pdfxi-standards -- --check and cargo clippy -p pdfxi-convert -p pdfxi-standards --all-targets --all-features -- -D warnings both exit 0."
id = "EXPORT-008"
notes = """
Froze the conversion contract in pdfxi-convert: SourceKind and ExportKind
classify file names (case-insensitive, dot-optional, Unknown fallback);
ConversionOptions carries page range, image/annotation, and OCR settings with
validate(); ConversionError names unsupported source/export/pair and invalid
input; Converter exposes options(), can_import(), import(), and export(); and
MockConverter is a deterministic in-memory implementation. Terms are documented
as raw PDF bytes at the trait boundary so the crate has no dependencies. Real
PDF/A-X-E export adapters and the standards fixups are future work, hence
in-progress.
"""
