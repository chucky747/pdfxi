(or typed identifier errors). XmpPacket::from_xml now also rejects non-comment,
non-PI, non-xmpmeta-close content after the rdf:RDF root so data cannot hide past
the closing tag. verify_xmp_scrub re-parses the produced bytes and reports
residuals; check() returns typed SecurityError::ScrubVerificationFailed scoped
to ScrubCategory::Xmp. scrub_and_verify_xmp performs both steps atomically.

Library scope boundary: parsing is intentionally limited to the canonical
structured subset (arbitrary third-party XML byte surgery stays out of scope by
design); real PDF object/stream deletion and byte output are handled by the
existing sanitize_document/pdfxi-core writer path. No property values, document
contents, or secrets appear in reports or errors.
