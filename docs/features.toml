id = "VIEW-001"
notes = """
T-0106 adds pdfxi_app::open, a window-free document-open pipeline. DocumentOpenPipeline checks a CancellationToken before and after the load, records a typed OpenResult against a TabId in per-tab OpenTabStates, captures page count, metadata title, and EncryptionState in a plain OpenedDocument, and keeps a bounded most-recent-first RecentFiles list. Failures use typed OpenError variants. MockDocumentOpener is deterministic and available by default; PdfiumDocumentOpener (feature pdfium) opens real PDFs with PDFium and reads metadata through PdfiumRenderer::document_meta, added to pdfxi-render as DocumentMeta with page count, title, and security revision.

T-0106 adds pdfxi_app::print, an app-level front end to pdfxi_render::print. PrintModel covers all/current/selection/custom page ranges (custom expressions parsed by pdfxi-render), copies, orientation, fit/actual/custom-percent scale, duplex, and Letter/A4/Legal/custom paper. It validates with typed PrintModelError variants and resolves a deterministic PrintPlan (zero-based expanded pages, full PrintSettings, stable summary) through pdfxi_render::print::PrintJob. PrintDialogState holds window-free dialog state; submitting only resolves data.

The ui feature wires a Print dialog and an open-errors window into PdfxiApp with window-free helper methods and tests (no GUI or printer needed). Host boundary: this task produces plan and raster data only; sending pdfxi-render::print rasters to a platform printer driver remains a later adapter, so VIEW-001 stays in-progress. All public items have rustdoc; both crates deny missing docs and forbid unsafe; non-test code uses no unwrap/expect/panic.
"""
