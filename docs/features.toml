id = "EXPORT-006"
notes = """
Added renderer-driven page-image export to pdfxi-convert. The core API stays
renderer-agnostic: export_pages(&dyn Renderer, &ImageExportPlan,
&CancellationToken) resolves a PageSelection (All, one-based Range, or an
ordered one-based Pages list), validates the plan, and returns an ordered
Vec<ExportedImage> carrying page, width, height, encoded bytes, and format.
ImageExportPlan documents page selection, resolution (direct scale or DPI
converted with scale = dpi / 72.0), PNG/PPM format, and output naming with a
page-{page}/index pattern. Encoding uses the dependency-free pure-Rust encoders
in crates/pdfxi-convert/src/image.rs: 8-bit RGBA PNG with signature, IHDR, one
stored-deflate zlib IDAT (CRC-32 per chunk, Adler-32 trailer, 65,535-byte
multi-block splitting) and binary P6 PPM; both reject mismatched buffers and
overflowing dimensions. ConversionError gained Cancelled and Render variants so
cooperative cancellation and backend failures are actionable. A default-off
dependency-light build remains available with --no-default-features; the
optional pdfium feature adds export_pdf_bytes/export_pdf_file convenience
constructors without changing the core trait-based API. The CLI has an
equivalent image encoder in crates/pdfxi-cli/src/image.rs; deduplicating them
into a shared low-level crate is a documented follow-up and was out of scope.

Status stays in-progress because EXPORT-006 also names JPEG and TIFF, which are
not implemented; PNG and PPM are delivered and verified.
"""
