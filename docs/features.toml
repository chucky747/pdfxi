T-0160 adds `pdfxi_automation::sequence_batch`, a FIFO `SequenceBatchQueue`
whose unit of work is the existing `ActionSequence` (complementing the older
`Action`-based `BatchQueue`). `enqueue`/`dequeue` provide deterministic first-in
first-out ordering; duplicate and unknown ids are typed errors. Each
`SequenceBatchItem` follows a validated state machine
(queued -> running|failed|cancelled, running -> succeeded|failed|cancelled,
terminal states accept none). Cooperative cancellation uses the existing
`CancelToken`: `cancel`/`cancel_all` mark queued items cancelled and mid-run
cancellation keeps the steps completed before the signal. `run_all` validates
each sequence, isolates failures to their own item, and is idempotent on
terminal items. Step effects stay behind the injected `SequenceStepRunner`
trait with a side-effect-free `RecordingRunner` default, so no I/O or real PDF
mutation occurs. `SequenceBatchReport::summary` is byte-stable across runs. All
public items have rustdoc; no new dependency, unsafe, or non-test panic. Prior
T-0050 CLI batch evidence is retained below.
