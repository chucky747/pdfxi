id = "FORMS-001"
notes = """
T-0035 adds a FormFill filling session over the existing Form model. set/fill_many/fill_from_fdf delegate every write to Form::set_value, which now enforces a fixed check order (unknown field, read-only, value-shape type mismatch, clearing a required field). ValueKind categorises FieldValue variants and Field::accepts encodes the per-type compatibility matrix (text accepts text + number, checkbox accepts bool, radio accepts at most one choice, choice accepts one or many, button accepts only empty, signature accepts text, unknown accepts all). Validation gained InvalidValueType so the shape check is also enforced on a pure validation pass. FillReport reports net changes in ascending field-name order, collapsing repeated writes to the original old value and dropping fields restored to their original value; finish/finish_validated/into_form expose the filled form. Loading values from PDF /AcroForm dictionaries and writing widget appearances are still deferred, so the row remains in-progress.
"""
