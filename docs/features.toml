[[feature]]
docs = "crates/pdfxi-core/src/parser.rs"
domain = "Standards"
evidence = "cargo test -p pdfxi-core (CARGO_TARGET_DIR=target/lanes/core): 48 passed; 0 failed. cargo clippy -p pdfxi-core --all-targets --all-features -- -D warnings: clean. cargo fmt -p pdfxi-core -- --check: clean. RUSTDOCFLAGS=-D warnings cargo doc -p pdfxi-core --no-deps: clean. docs/evidence/core/T-0023.md"
id = "STD-002"
notes = "Classic xref tables are fully parsed: final startxref lookup, subsection headers, n/f entries, trailer dictionary, /Root, and /Prev chains with newest-wins merging and cycle detection. The /Pages tree is walked recursively with cycle guards and inherited MediaBox/Resources; /Count, leaf page MediaBox and /Contents references are exposed via Document::page_count, page, pages, root, trailer_size and declared_page_count. FlateDecode is decoded by a dependency-free, cap-bounded inflater with PNG predictor support, and page_content/page_text decode compressed streams transparently. Unsupported filters return a named FilteredContent error. Xref streams remain out of scope and keep the row in-progress."
