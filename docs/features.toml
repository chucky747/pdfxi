domain = "View & Navigate"
evidence = "cargo test -p pdfxi-app: 281 passed, 0 failed, including 14 new presentation::tests::* covering document-order slides, empty-document and invalid-duration typed errors, strict page-order validation, transition/command labels, next/prev/first/last/exit command walking and boundary clamping, keyboard/gesture mapping, auto-advance accumulation with remainder carry and identical-tick determinism, multi-slide crossing to Finished, manual zero-duration stop, invalid tick rejection, restart-from-finished, and fit/actual layout math (centred, non-finite/negative geometry rejected). cargo test -p pdfxi-app --features ui: 344 passed, 0 failed. fmt/clippy/doc EXIT=0. Full output in docs/evidence/app/T-0141.md."
id = "VIEW-012"
notes = """
Window-free full-screen presentation model. PresentationModel holds a sequence
of Slides (document page index, duration, Transition None/Fade/Push); `new`
builds every page in ascending document order and `from_slides` accepts a
subsequence only when pages are strictly increasing, so document page order is
always honoured. Slide::new rejects non-finite/negative durations with
PresentationError::InvalidDuration; an empty document yields EmptyDocument.
Auto-advance is a caller-timed state machine (Stopped/Playing/Finished/Exited):
`tick(elapsed)` accumulates supplied seconds, carries the remainder across
slides on a large tick, treats duration 0.0 as a manual slide that halts
auto-advance, ignores invalid/negative inputs, and reports outcomes
(Nothing/PageChanged/AutoAdvanceStarted/AutoAdvanceStopped/Finished/Exited).
Navigation commands next/prev/first/last/exit and auto-advance toggle have both
keyboard (`map_presentation_key`) and swipe (`map_presentation_gesture`) paths.
`layout`/`layout_rect` compute deterministic centred fit (uniform scale,
letterboxed) and actual (1:1) placements for a given viewport and page size.

Honest scope: pure model only. No OS full-screen window transition, no native
key/gesture event capture, no rendering or animation is performed — the host
must translate outcomes into those effects. Hence `in-progress` per ADR 0008.
"""
