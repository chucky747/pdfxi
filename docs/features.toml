id = "EXPORT-009"
notes = '''
T-0110 adds a dependency-free PostScript writer in crates/pdfxi-convert/src/postscript.rs.
It emits a deterministic, DSC-conformant PostScript program: %!PS-Adobe-3.0 header,
%%Creator/%%Title/%%BoundingBox (ceiling of max page extent)/%%Pages/%%DocumentFonts,
comment/prolog/setup sections, one %%Page block with a single showpage per page, and a
%%Trailer/%%EOF. Text is drawn with standard fonts (Helvetica, Helvetica-Bold, Courier,
Times-Roman, Times-Bold); rectangles use closed fill/stroke paths and lines use
moveto/lineto/setlinewidth/stroke. PostScript literal strings escape \, (, ), control
characters and encode Latin-1 bytes as octal escapes. Code points outside Latin-1 and
PsContent::Image are skipped and enumerated in PsExportReport (per page, with reasons)
via export_postscript_with_report, so unsupported content is documented honestly rather
than silently faked. Typed PsExportError variants cover empty/oversized input, duplicate
pages, bad geometry, non-finite coordinates and non-positive font sizes. Bounded
constants prevent unbounded allocation; no new dependencies, no unsafe, and no
unwrap/expect/panic in non-test code.

Honest caveat: the writer consumes a caller-supplied page/content model; there is no
ExportKind::PostScript variant or CLI dispatch and no real PDF content pipeline wired
in this task, so EXPORT-009 remains in-progress.
'''
