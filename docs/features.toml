domain = "Edit"
evidence = "T-0052 (security): 16 redaction tests + clippy/doc clean. T-0076 (author): cargo test -p pdfxi-edit 138 passed, including 27 new redaction tests; fmt/clippy/doc EXIT=0. T-0146 (author, library-level closure): cargo test -p pdfxi-edit 278 passed, 0 failed, including 10 new redaction::tests; fmt/clippy/doc EXIT=0 (RUSTDOCFLAGS=-D warnings). Full output in docs/evidence/author/T-0146.md."
id = "EDIT-013"
notes = """
Library-level EDIT-013 is complete. Marks are rectangular page regions with an
optional text-run (pattern) selection model. RedactionPlan sorts regions into a
canonical (page, kind, contents) order and deduplicates exact regions in both
new() and add(); execution order is independent of insertion order. Validation
rejects non-finite/empty rectangles, blank patterns, zero page numbers,
rectangles on unknown pages or outside declared page bounds, and (under
OverlapPolicy::Reject) partially overlapping marks on the same page; edge-touching
rectangles are not overlaps. RedactionPlan::validate_geometry defensively
re-checks constructor invariants before any removal or verification.

A permanent-removal plan contract is now explicit. PermanentRemovalPlan pairs
the marks with an OverlapPolicy and optional RedactionMetadata (non-blank
author/subject, non-negative created_unix_ms, typed InvalidMetadata errors with
stable Display wording). Its execute() validates the plan and then invokes a
caller-supplied ContentRemover once per page in ascending page order.

SECURITY BOUNDARY: ContentRemover is the single security-critical step that
physically rewrites content streams so redacted text is removed, not covered.
This crate deliberately does not duplicate that security logic: in this
workspace that step is owned by pdfxi-security's redaction engine, and callers
that own a remover supply one through the trait. StreamContentRemover delegates
to this crate's one internal stream rewriter for callers without a separate
engine. The fake DroppingRemover test drops matched bytes without painting any
cover box, proving the contract requires removal.

Verification is caller-supplied-text based: PermanentRemovalResult::verify and
the free verify_extracted_text build a RedactionReport from post-removal text
and prove that marked regions no longer expose their content; strict mode fails
via check() when residuals remain. The T-0076 stream-level proof (Tj/TJ/'/"
operators dropped, Form XObjects recursed with a depth/cycle limit, overlapping
inline images removed, annotations/links/metadata stripped) is retained.

Out of scope for this library-level row and delegated to other lanes:
rendering-based verification that rasterised image content inside a rectangle
is gone (render lane) and UI/CLI exposure of the redaction workflow (app lane).
"""
priority = "P1"
status = "verified"
