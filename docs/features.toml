    "print::tests::orientation_and_margins_change_fit_dimensions",
    "print::tests::dpi_scales_raster_dimensions",
    "print::tests::cancellation_before_spool_does_not_render",
    "print::tests::cancellation_between_pages_stops_after_first_page",
    "print::tests::progress_is_monotone_and_complete",
