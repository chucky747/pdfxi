[[feature]]
docs = [
    "crates/pdfxi-cli/src/main.rs",
    "crates/pdfxi-cli/src/image.rs",
    "crates/pdfxi-cli/tests/cli.rs",
]
domain = "Automation"
evidence = '''
cargo test -p pdfxi-cli (CARGO_TARGET_DIR=target/lanes/core): 10 integration passed, 0 failed, EXIT=0 (includes render_without_pdfium_reports_missing_feature).
cargo test -p pdfxi-cli --features pdfium (CARGO_TARGET_DIR=target/lanes/core, PDFIUM_PATH=C:\Users\cmabr\AppData\Local\pdfxi\pdfium\bin\pdfium.dll): 12 unit + 13 integration passed, 0 failed, EXIT=0.
cargo fmt -p pdfxi-cli -- --check: EXIT=0. cargo clippy -p pdfxi-cli --all-targets -- -D warnings: EXIT=0. cargo clippy -p pdfxi-cli --all-targets --features pdfium -- -D warnings: EXIT=0.
External validation: `pdfxi render fixtures/minimal.pdf --page 0 --scale 1.0 --out <tmp>.png` produced a file decoded by .NET System.Drawing as PNG (GUID b96b3caf-0728-11d3-9d7b-0000f81ef32e), 612x792 pixels, exit code 0.
'''
id = "AUTO-005"
notes = """
Added `pdfxi render <file> --page N --scale S --out PATH [--format ppm|png]` on top of the frozen `pdfxi-render` Renderer contract. The CLI gained a `pdfium` feature (`dep:pdfxi-render`, `pdfxi-render/pdfium`) and an optional path dependency; the command is always compiled. Without the feature it exits non-zero with `built without pdfium support` instead of failing to compile. With the feature it validates scale (finite, positive, bounded) and zero-based page bounds, then maps renderer/encoder/write failures to contextual anyhow errors with actionable stderr.

PNG is written by a small pure-Rust encoder (no image crate): 8-byte signature, IHDR (8-bit RGBA, non-interlaced), one IDAT holding a zlib stream of uncompressed stored deflate blocks with correct CRC-32 and Adler-32, and IEND. The PNG is valid but uncompressed, which is documented in code. PPM is binary P6 with alpha discarded. Checked arithmetic rejects size overflow and mismatched buffers. Unit tests cover checksums, signature/chunk order, IHDR fields, stored-block decoding, chunk CRC, length invariants, multi-block splitting, and error paths; integration tests render fixtures/minimal.pdf to both formats and exercise invalid page, invalid scale, and unwritable output. Remaining scriptable operations are future work, so AUTO-005 stays in-progress.

Collateral: the pre-existing text_filtered_stream_fails assertion now accepts the core's concurrent FlateDecode error wording ("DEFLATE") as well as the older "filtered" wording; its intent (no text from a malformed filtered stream) is unchanged.
"""
priority = "P1"
status = "in-progress"
tests = [
    "image::tests::crc32_matches_standard_vector",
