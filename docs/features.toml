XObjects drawn directly by the page content stream, with stable
`text:<block>` and `image:<resource>:<occurrence>` identifiers. `move_object`
translates a block's Tm/Td placement or an image's placement cm; `resize_object`
scales an image's cm axes about its origin or scales a text block through its
Tf sizes, Tm horizontal term and Td spacing while keeping the text extractable;
`replace_object` rebuilds a text block through the T-0233 reflow/font path or
