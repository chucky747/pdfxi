id = "AUTO-003"
notes = """
Verified through `pdfxi watch <FOLDER> --out DIR [--markers PATH] [--ext EXT ...]
[--suffix EXT] [--poll-every N] [--base-ticks N] [--max-ticks N]
[--multiplier N] [--ticks N] [--json]`.

The host canonicalizes the watched folder and output directory (created when
absent, and rejected when inside the folder so outputs cannot be rescanned),
builds a WatchedFolderConfig (default extension and suffix pdf), loads a marker
snapshot with MarkerSnapshot::from_json_string when present, and advances
PollSchedule for the requested host ticks. A poll runs only on a Due decision;
EveryTicks(n) and the bounded backoff decide the gap; a poll with failures calls
record_failure and otherwise record_success. Eligible unmarked files are
converted with PassthroughConverter, written under the output root after a
component check, and the marker snapshot is atomically replaced. No thread,
timer, OS watcher or clock is started; a scheduler invokes the command.

Evidence: a watched folder with a.pdf (595 bytes), b.pdf (3 bytes) and
notes.txt reports extensions ["pdf"], one due poll, 2 converted, 0 skipped,
1 unsupported, 0 failed, written 2, marker_count 2; outputs are byte-identical
and markers are {"paths":["a.pdf","b.pdf"],"version":1}. A second run reports
0 converted, 2 skipped, 0 written and identical markers. --poll-every 2 over
three ticks reports wait 1/due/wait 1, one poll and interval=every_ticks:2.
Missing folders, output inside the watched folder, zero ticks, zero base ticks,
multiplier 999, an invalid extension token and malformed markers are rejected.

Gates: cargo test -p pdfxi-cli --test cli watch_ = 2 passed; whole workspace
fmt/clippy/tests green.

Scope: host poll half only, not a daemon; passthrough converter copies bytes
rather than transforming them; markers record successful conversions so failures
retry.
"""
priority = "P3"
status = "verified"
tests = [
    "cli::watch_processes_files_and_persists_markers",
    "cli::watch_rejects_unsafe_or_invalid_setups",
    "watched_schedule::tests::markers_round_trip_through_the_persistence_contract",
    "watched_schedule::tests::backoff_is_bounded_monotonic_and_zero_at_clean_state",
]
title = "Droplets and watched folders"

