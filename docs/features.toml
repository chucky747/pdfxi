id = "SEC-010"
notes = """
Hardened from the T-0162 state. The integrity-only SecurityEnvelope can now be
built with a caller-supplied authentication key: an authenticated (version 2)
envelope carries a keyed HMAC-SHA256 tag in addition to the unkeyed SHA-256
digest, and open_security_envelope_with_key requires that key and verifies both
tags before returning. A tampered payload or permission block with a recomputed
unkeyed tag is rejected (EnvelopeAuthenticationFailed), as is a wrong key;
an unkeyed envelope is never accepted by the keyed opener. Backward
compatibility is preserved: version-1 integration-only envelopes still open via
open_security_envelope and report Integrity::Unkeyed, with the explicit warning
that their payload and permissions are untrusted. Both envelope `Debug` impls
render the payload as a length only. The shared HMAC-SHA256 primitive gained an
RFC 4231 known-answer test and replaced a private copy in digital_id_lifecycle;
its long-key branch (32 bytes into a 64-byte block) was corrected. The adjacent
XMP scrub residual check now uses parsed namespace declarations rather than a
raw substring, so a selected URI occurring only in an unselected value is not
reported. CertificateEnvelope, EncryptionScope and the protection-policy model
are unchanged. Local/offline only; still no network, licence server, new deps
or panics.
"""
