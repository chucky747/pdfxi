domain = "Forms"
evidence = "cargo test -p pdfxi-forms: 268 passed, 0 failed, TEST_EXIT=0; 13 new fillworkflow tests cover text/choice/checkbox end-to-end, validation failure, readonly rejection, required missing, reset, serialized round-trip value preservation, signature blocked without signature, signature transition recorded, deterministic bytes/plan, malformed input, parse-back rejection, number/clear and reset-field. fmt/clippy/doc EXIT=0. Full output in docs/evidence/forms/T-0147.md."
id = "FORMS-001"
notes = """
T-0147 closes the library-level headless fill workflow. `FillDocument` loads a
caller-supplied parsed model either from `FieldSpec`s (`from_specs`) or from an
already-loaded `Form` plus its matching `/AcroForm` dictionary model
(`from_parts`, with shape and page-reference checks). `FillWorkflow` writes
values with validation inherited from `Form::set_value`/`Form::validate`
(readonly, required, type shape, choice/text constraints), supports clear,
reset and per-field reset, and produces a deterministic `FilledDocumentPlan`:
final field/widget dictionaries with `fill_acroform`-regenerated `/AP /N`
appearances, a name-sorted `AcroFillReport`, a validation snapshot and signature
workflow records. `FilledDocumentPlan::serialize` emits concrete PDF bytes with
the T-0140 `serialize_form_pdf` serializer and `verify` parses them back with
`parse_pdf`, reading each `/V` (with `/DV` fallback per PDF semantics) to prove
the filled values survived. `finish` performs validate → plan → serialize →
verify in one typed-error call.

All new public items have rustdoc; the crate denies missing docs and forbids
unsafe. Non-test code uses no unwrap/expect/panic. Read-only fields keep their
caller-supplied dictionary entries and are not re-appeared by the fill pass.
Host-level CLI/UI binding is a separate lane concern, not library scope, so the
row is verified at the library boundary this task owns.
"""
