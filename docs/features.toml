id = "SEC-006"
notes = """
T-0143 extends timestamp validation with a host-facing TsaTokenModel and
detached-signature wiring, complementing the existing full RFC 3161 CMS token
validation in the timestamp module. TsaTokenModel takes a caller-supplied TSA
certificate, an imprint built from supplied signed bytes, an optional nonce, a
policy OID and a generation time; construction validates structure and imprint
length with typed errors. validate_tsa_token recomputes the imprint, checks the
nonce, classifies the certificate window at the caller-supplied time, checks the
policy OID against an optional accepted set, and returns a deterministic
TsaValidationReport recording every dimension plus a conservative SignatureStatus
mapping (Valid / Tampered / Invalid / Expired / Unknown). validate_detached_signature_against_certificate
checks the provider's certificate against a supplied certificate, classifies its
window at caller time, verifies a detached CMS signature over caller content, and
never promotes a valid CMS result when the certificate is outside its window.
Typed errors: TsaTokenInvalid, DetachedSignerMismatch (plus existing CMS errors).
No network, no wall clock, no hidden trust store.

Host boundaries (not library gaps): online TSA enrollment/request transport,
revocation/CRL status inside a concrete PDF signature workflow, and the
trust-manager desktop UI remain host/follow-on adapters. The full RFC 3161
token path from T-0077 remains available and unchanged.
"""
