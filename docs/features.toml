domain = "Standards"
evidence = "cargo test -p pdfxi-core -p pdfxi-standards (CARGO_TARGET_DIR=target/lanes/core): 300 core unit + 6 core integration + 74 standards passed, 0 failed; 11 xref_stream::tests and 18 xref_tests green; fmt/clippy -D warnings/rustdoc -D warnings EXIT=0. Full output in docs/evidence/core/T-0152.md."
id = "STD-002"
notes = """
General, deterministic xref-stream writing is now implemented in
pdfxi-core::xref_stream. XrefStreamPlan::build derives entry order, /Index
ranges, minimal /W widths and payload size purely from its inputs; it rejects
empty sets, reserved object zero, conflicting duplicates, an absent catalog or
xref-stream entry, hostile sizes, over-fragmented inputs, offsets that cannot
fit a bounded field and row widths beyond the reader bound.
write_xref_stream_document and Document::save_with_xref_stream emit a standalone
/Type /XRef stream that round-trips through the parser (page count and text
preserved) for both compressed and uncompressed payloads, from classic and
