Verified through the CLI host: `pdfxi optimize <FILE> --out <PATH>
[--remove-metadata] [--remove-optional] [--no-compress] [--json]` loads the
document, runs `Document::optimize` with a fresh cancellation token, writes the
standalone result and prints the deterministic report (signed size change, object
counts, streams compressed, images passed through, deduplicated, removed,
warnings). `--out` is required and self-overwrite is refused after
canonicalising both paths, so an interrupted run cannot destroy the source; the
refusal test re-reads the input to prove it is untouched.

Evidence on fixtures/realworld/powerpoint-slides.pdf: 119341 -> 118516 bytes
(-0.7%), 68 -> 65 objects, 1 stream compressed, 2 deduplicated, 1 removed; the
optimized file reopens with 3 pages and byte-identical page text at every page
(text_diffs=0). `--remove-metadata` drops `/Info` and the XMP `/Metadata`
stream (raw scan hits 0; the baseline optimized file has 3), shrinking to 117445
bytes. Running the same command twice yields a byte-identical JSON report.

Gates: cargo test -p pdfxi-cli = 35 bin tests + 115 integration tests + 1 doc
test, clippy -p pdfxi-cli --all-targets -D warnings = 0, fmt --all --check = 0.

Scope kept honest: compression stays per stream with a strict no-growth policy,
so the whole file can still grow slightly after renumbering, and the report
prints the real change; image re-encoding is not claimed.
"""
