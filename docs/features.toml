cargo test -p pdfxi-cli (CARGO_TARGET_DIR=target/lanes/core): 18 integration passed, 0 failed, EXIT=0 (8 new search_* tests plus the 10 pre-existing tests).
cargo test -p pdfxi-cli --features pdfium (CARGO_TARGET_DIR=target/lanes/core, PDFIUM_PATH=C:\Users\cmabr\AppData\Local\pdfxi\pdfium\bin\pdfium.dll): 12 unit + 21 integration passed, 0 failed, EXIT=0.
cargo fmt -p pdfxi-cli -- --check: EXIT=0. cargo clippy -p pdfxi-cli --all-targets -- -D warnings: EXIT=0. cargo clippy -p pdfxi-cli --all-targets --features pdfium -- -D warnings: EXIT=0.
cargo doc -p pdfxi-cli --no-deps (RUSTDOCFLAGS=-D warnings): EXIT=0.
'''
id = "AUTO-005"
notes = """
Added `pdfxi render <file> --page N --scale S --out PATH [--format ppm|png]` on top of the frozen pdfxi-render Renderer contract. The CLI gained a pdfium feature (dep:pdfxi-render, pdfxi-render/pdfium) and an optional path dependency; the command is always compiled. Without the feature it exits non-zero with `built without pdfium support` instead of failing to compile. With the feature it validates scale (finite, positive, bounded) and zero-based page bounds, then maps renderer/encoder/write failures to contextual anyhow errors with actionable stderr.

PNG is written by a small pure-Rust encoder (no image crate): 8-byte signature, IHDR (8-bit RGBA, non-interlaced), one IDAT holding a zlib stream of uncompressed stored deflate blocks with correct CRC-32 and Adler-32, and IEND. The PNG is valid but uncompressed, which is documented in code. PPM is binary P6 with alpha discarded. Checked arithmetic rejects size overflow and mismatched buffers. Unit tests cover checksums, signature/chunk order, IHDR fields, stored-block decoding, chunk CRC, length invariants, multi-block splitting, and error paths; integration tests render fixtures/minimal.pdf to both formats and exercise invalid page, invalid scale, and unwritable output.

T-0033 adds a second scriptable operation, `pdfxi search`, backed by a new path dependency on pdfxi-text (no new external crates). It calls `pdfxi_core::page_text` per page, builds a SearchIndex, and prints deterministic `page N offset M text` lines or stable JSON. It supports --case-sensitive, --whole-word, and --json; no matches exit 0 with empty stdout and a stderr note. Eight new integration tests cover a single match, multi-page ordering, case folding, whole-word, no-match behavior, JSON field stability, a missing file, and an unsupported-filter error. Remaining scriptable operations are future work, so AUTO-005 stays in-progress.
"""
