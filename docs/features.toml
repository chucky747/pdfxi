width and re-emits it at the original baseline while preserving other
operators. The source font is reused only when it is a non-subset simple font
that encodes every character; otherwise Courier Prime Regular (SIL OFL 1.1) is
embedded in full as a Type0/CIDFontType2 with FontFile2, sequential CIDs, a
CIDToGIDMap stream, spec-valid CID-keyed /W widths in thousandths of text space
and a generated ToUnicode CMap. `add_text_box` and `add_image` (8-bit PNG decoded
locally, JPEG as DCTDecode) append real content and resources. Proven by saving
and reparsing the Excel 2019 fixture: the replacement sentence is extracted
without the old text, page order is sane, and page 2 text plus an /Image XObject
survive. A PDFium render test (dev-dependency) rasterizes the edited bytes and
rejects a solid bar: the edited sentence crop has 221 distinct luminance values
and 7.2% dark pixels versus 210/9.8% on the original, and the added text box has
184/3.6%. Limits:
one font per block, greedy non-justified wrap, horizontal text, per-operation
font embedding, alpha ignored for PNG. The app shell task still owns the
verified row.
