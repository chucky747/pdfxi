domain = "View & Navigate"
evidence = "docs/evidence/cli/T-0283.md"
id = "VIEW-015"
notes = """
Verified through the CLI host. `pdfxi compare <LEFT> <RIGHT>` extracts each
page's text, normalises lines (trim, drop empties), aligns pages with a
deterministic LCS, and zips deletion/insertion blocks in place into changed
pairs, so a replaced page is one `changed` pair and leftover pages stay
inserted/deleted. Aligned pairs report removed/added line counts from a
line-level LCS; `--lines` prints differing lines as `- left | + right`, capped
at 20 rows per page. `--json` has stable fields (`left`, `right`, `left_pages`,
`right_pages`, `identical`, `summary`, `pages[]`). `--fail-on-difference` prints
the report and exits 1.

