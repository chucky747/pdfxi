domain = "View & Navigate"
evidence = """
CARGO_TARGET_DIR=target/lanes/app (via scripts/env.ps1 -Lane app).
cargo test -p pdfxi-app: 52 passed; 0 failed; 0 ignored; doc-tests 0 failed.
cargo test -p pdfxi-app --features ui: 71 passed; 0 failed; doc-tests 0 failed.
