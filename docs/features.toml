"""
id = "FORMS-006"
notes = """
Added FDF 1.7 export/import. export_fdf writes a canonical %FDF-1.7 object with /Fields sorted by name, skipping NO_EXPORT fields: literal strings escape ( ) and newlines, control bytes use short escapes, and non-ASCII UTF-8 bytes use three-digit octal escapes for byte-exact round-trips. Booleans map to /On and /Off, multi-select choices to arrays of literal strings, numbers to bare PDF numbers, and non-finite numbers are rejected with FdfError::NonFiniteNumber. import_fdf is a bounds-checked byte parser (header/version, indirect objects, trailer, trailer references, nested arrays/dictionaries, literal strings with nesting and octal escapes) that returns structured FdfError variants with byte offsets for malformed input. FdfDocument fields feed directly into FormFill::fill_from_fdf. export_xfdf emits a small schema-compatible XML subset (escaped names/values, one <value> per choice) but XFDF import is deliberately out of scope for this task; the row therefore stays in-progress.
"""
