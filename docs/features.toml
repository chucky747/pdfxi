domain = "Security"
evidence = "cargo test -p pdfxi-security (CARGO_TARGET_DIR=target/lanes/security): 153 passed, 0 failed, including 17 timestamp::tests cases (valid token, wrong imprint, bad CMS signature, tampered TSTInfo digest, untrusted TSA, missing timeStamping EKU on a trusted TSA, EKU override, certificate-invalid-at-genTime, nonce mismatch, future/skew, malformed DER, missing fields, status mapping) and 2 der time tests (fractional seconds accepted, malformed forms rejected). fmt/clippy(-D warnings)/rustdoc(-D warnings) clean for pdfxi-security. docs/evidence/security/T-0077.md"
id = "SEC-006"
notes = """
Signature validation for the CMS subset remains as before (digest recomputation,
signed-attribute checks, signature verification via the provider, typed
tampering/truncation/algorithm errors). T-0077 adds RFC 3161 trusted timestamp
validation: TSTInfo parsing, CMS token signature and TSTInfo digest verification,
messageImprint matching, caller-clocked chain trust at genTime, replay/skew and
nonce policy, and a conservative TimestampStatus -> SignatureStatus mapping.

Disclosed behavior from the security review:
- TSA EKU: RFC 3161 section 2.3 id-kp-timeStamping is enforced by default via
  TimestampPolicy::required_tsa_eku. A chain-trusted TSA certificate without
  this purpose yields TimestampEkuMissing (mapped to SignatureStatus::Unknown),
  never Valid. Callers may explicitly set another purpose or None to disable;
  the override is documented and tested.
- GeneralizedTime: RFC 3161 genTime accepts fractional seconds (.sss...Z,
  1-9 digits). The DER decoder validates the fraction but discards it because
  the public time type is whole Unix seconds; sub-second precision is not
  represented in TstInfo::gen_time and is not used by skew or nonce checks.
  UTCTime and malformed fractional forms are rejected.

Revocation/CRL checks, a trust-manager UI, and applying these checks inside a
concrete PDF signature workflow remain planned (SEC-007), so the row stays
in-progress rather than verified.
"""
