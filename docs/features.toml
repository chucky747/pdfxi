JSON codec, and the ConfidencePolicy suspect report). T-0071 adds the
SidecarOcrEngine process bridge: validated configuration, no-shell spawn with a
fixed literal argv, cleared environment with an explicit allowlist, bounded
stdout, and a supervisor that kills/reaps the child on timeout, cancellation, or
pipe I/O errors, with typed SidecarError variants mapped onto OcrError. Review
fixes cover a non-draining-stdin deadlock, child reaping on early exit, strict
executable-path validation, and JSON surrogate pairs. The row remains
in-progress because a real Tesseract binary and the end-to-end
scanned-page-to-searchable-PDF flow are future work; only the bridge contract
and its security/timeout behaviour are verified here.
"""
