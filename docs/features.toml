    "find_replace::tests::find_all_is_deterministically_ordered_regardless_of_input_order",
    "find_replace::tests::empty_query_is_rejected",
    "find_replace::tests::oversized_query_and_line_are_rejected",
    "find_replace::tests::invalid_whole_word_query_and_zero_cap_are_rejected",
