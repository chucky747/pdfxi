patient/agree/color/state with real rects and one-based pages, wrapped
next/previous pairs, a columns override that reorders the widgets and --no-wrap
giving (none) at both ends. A two-field form with a staged /A ResetForm on
patient and /AA K ResetForm plus F JavaScript on state reports two accepted steps
(patient [A], state [K]) and one rejected JavaScript entry with its reason; the
patched PDF is written to target/lanes/forms/t0297/actions.pdf. A form-free PDF
reports present:false, zero actions and zero widgets; an unknown policy is a
typed error.

