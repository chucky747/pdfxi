id = "AUTO-002"
notes = """
Added BatchJob, JobState (queued/running/succeeded/failed/cancelled), JobOutcome,
CancelToken, the StepExecutor trait, MockExecutor, and BatchQueue. The queue is
deterministic and single-threaded: jobs run in insertion order, steps run in
action order, a failed or cancelled job never stops its siblings, and a stable
per-file outcome summary is recorded for each job. Cancellation works before a
run (cancel_job / cancel_all) and cooperatively from inside a step via a shared
CancelToken (MockExecutor::cancel_at_step). Remains in-progress: watched folders
and droplets are future milestones.
"""
