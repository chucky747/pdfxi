notes = """
Assistant tool lockdown and untrusted-document handling per ADR 0013. Every
assistant turn creates a locked session: the client refuses a service outside
2.3.x with IncompatibleVersion before POST /api/session, sends a wildcard deny
ahead of the five read-only document allows, verifies the ruleset by exact
read-back and deletes the session on any mismatch. The app wires no shell, file,
network, edit or MCP tool, so no tool execution path exists in the turn.
Grounding does not use the client-MCP tool route: on OpenCode 2.3.2 the attach
completes and the service lists all five tools, but the model never receives
their schemas (tool_names=[], tool_calls=[]), so the app sends a bounded, fenced
prompt excerpt instead - a 24,000-character cap, an untrusted-document
instruction, an <untrusted-document-text> fence whose forged terminator is
neutralized, explicit included pages and a truncation marker. The excerpt is
built only at Ask time; opening the panel or typing sends nothing. BudgetedTools
and the MCP attach remain library capabilities in pdfxi-assistant that the app
does not call.
"""
