[[feature]]
docs = [
    "crates/pdfxi-app/src/loupe.rs",
    "crates/pdfxi-app/src/lib.rs",
    "docs/evidence/app/T-0173.md",
]
domain = "View & Navigate"
evidence = "docs/evidence/app/T-0173.md: 4 new loupe::tests plus the 10 prior loupe tests all pass; cargo test -p pdfxi-app 381/0 and --features ui 444/0; fmt/clippy/doc EXIT=0."
id = "VIEW-018"
notes = """
Verified for the deterministic loupe/gesture model only (ADR 0008). The existing
geometry validation, zoom clamping, exact page/screen inverses, source/dest rect
mapping, shape-aware hit testing, bounded drag/scroll/pinch handling and
determinism are now complete at model level. T-0173 adds
`LoupeModel::reset_accumulated_drag()`: the bounded drag total previously had no
reset path and could only saturate for the whole session, so a host could not
start a fresh per-pointer gesture sequence; panning and zoom state are left
untouched by the reset. New tests pin accumulator reset/restart, half-open
rectangle and closed-radius circle hit-test boundaries, `screen_to_page`
destination-corner inversion plus exact centre mapping, and the distinction
that scroll deltas pan without feeding the drag accumulator.

Remaining scope is the host boundary and is deliberately not claimed: no native
pointer/scroll/pinch event capture, no OS window, and no magnified-raster
rendering. The host feeds `GestureDelta`s into `apply` and draws `dest_rect`.
"""
priority = "P2"
status = "model"
tests = [
    "loupe::tests::new_validates_geometry_and_centres_the_lens",
    "loupe::tests::zoom_is_bounded_and_sanitized",
    "loupe::tests::page_to_screen_and_screen_to_page_round_trip",
    "loupe::tests::source_rect_maps_round_trip_to_dest_rect",
    "loupe::tests::lens_hit_testing_is_shape_aware_and_deterministic",
    "loupe::tests::drag_and_scroll_pan_and_clamp_to_page",
    "loupe::tests::gesture_accumulation_is_bounded",
    "loupe::tests::pinch_clamps_zoom_and_invalid_deltas_are_ignored",
    "loupe::tests::identical_gesture_sequences_are_deterministic",
    "loupe::tests::center_clamping_keeps_the_lens_inside_the_viewport",
    "loupe::tests::reset_accumulated_drag_starts_a_fresh_sequence",
    "loupe::tests::hit_testing_boundaries_are_half_open_and_radius_closed",
    "loupe::tests::screen_to_page_maps_dest_corners_to_source_corners",
    "loupe::tests::scroll_deltas_do_not_feed_the_drag_accumulator",
]
title = "Loupe magnifier and gesture navigation"

