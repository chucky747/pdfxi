id = "FORMS-003"
notes = """
Added a Calculation model for sum/product/average over named numeric fields. evaluate is side-effect free; apply writes the rounded result through Form::set_value (inheriting read-only and type checks); run_calculations applies an ordered batch and returns a CalculationReport. Rounding is deterministic (f64::round, ties away from zero, six decimals by default, at most 12). Non-numeric input is documented and rejected with CalculationError::NonNumeric (no implicit string coercion, no JavaScript); missing fields, empty operand sets, non-finite results, and invalid decimal counts have dedicated variants. Property editing UI and the Acrobat calculation-order semantics for cyclic dependencies are deferred, so the row remains in-progress.
"""
