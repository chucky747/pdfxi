id = "EDIT-007"
notes = """
Added a dependency-free `pages` module with `PagePlan` / `PageOperation` /
`RotationTarget`, a `Document::apply_page_plan` entry point, and structured
errors (`EmptyPageSelection`, `InvalidPageIndex`, `DuplicatePageIndex`,
`InvalidSourceDocument`, `InvalidPageRotation`). Every plan rebuilds a single
flat `/Pages` tree with a correct `/Count`, `/Kids` and per-page `/Parent`,
materializes inherited `/MediaBox`, `/Resources` and `/Rotate` onto each page,
and copies all other objects with remapped numbers and unchanged stream bytes.
Duplicate indices are explicit in Extract (each occurrence becomes its own
page object) and rejected in Reorder. All public items are rustdoc'd; the
crate keeps `#![forbid(unsafe_code)]` and uses no unwrap/expect/panic outside
tests.
"""
priority = "P1"
status = "verified"
tests = [
    "pages::tests::split_into_chunks_produces_independent_pdfs",
