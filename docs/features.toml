id = "CREATE-007"
notes = """
Verified through `pdfxi create scan --out PDF --scan PAGE.png [--scan ...]
[--dpi 300] [--duplex simplex|front-first|back-first] [--json]`.

The host reads each PNG, validates the signature/IHDR and extracts width/height
without decoding pixels, describes each page as a ScanSource (sheet, side, DPI,
ImageFormat::Png) and calls build_scan_plan. Each planned page is embedded with
create_from_image at the plan's exact point size (px/dpi*72) with zero margins,
then pages are merged in plan order via PagePlan::merge and apply_page_plan. The
written file is reopened and page count and every media box are checked against
the plan. Duplex pairs consecutive images and rejects incomplete pairs or backs
in simplex mode. PNG is the supported raster because the scan model's formats
and the image embedder intersect there.

Evidence: two 2x2 PNG pages at 72 dpi report pages 2, front 2, back 0, simplex,
verified_pages 2, two 2.00x2.00 pt pages and 2120 bytes; reopening reports 2
pages. Four images with --duplex front-first report pages 4, front 2, back 2 and
side/sheet order front1, back1, front2, back2; back-first swaps each pair.
Incomplete duplex, dpi 10, a JPEG path, a malformed PNG header, no --scan and a
missing file fail.

Gates: cargo test -p pdfxi-cli --test cli create_scan = 2 passed; whole workspace
fmt/clippy/tests green.

Scope: the TWAIN/WIA device adapter remains host-side; only rendered PNG pages
are accepted, with no OCR, deskew or orientation inference.
"""
