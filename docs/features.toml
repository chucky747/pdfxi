id = "CREATE-013"
notes = """
Verified through `pdfxi create postscript <INPUT.ps|eps> <OUTPUT.pdf> [--strict]
[--json]`.

The command reads real PostScript bytes and calls ingest_postscript (or
ingest_postscript_strict). A new pdfxi-convert::postscript_pdf writer turns the
captured PsContent into PDF: standard Type 1 fonts (Helvetica/Bold, Courier,
Times), Latin-1 literal strings with delimiter escapes, re/f/S rectangles and
m/l/S lines. Page boxes come from %%BoundingBox, otherwise content extents plus
a margin; object numbers and number formatting are fixed, so imports are
byte-identical. The host reopens the output, checks the page count and confirms
every captured text run extracts from its page.

It reports kind (PS/EPS), pages, declared pages, bounding box, text/line/rect
counts, unsupported findings (page, kind, token, reason), clean, strict and
bytes. Unsupported constructs are reported, or rejected with --strict.

Evidence: a one-page PS file with bbox 0 0 300 200, one show, one rectfill and
one stroked line reports kind PS, pages 1, 1 text/1 line/1 rectangle, clean
true, verified_pages 1, 1181 bytes; pdfxi info reports 1 page and pdfxi text
extracts "Hello PostScript"; repeated imports are byte-identical. An EPS body
reports kind EPS; a two-page file reports pages 2 and verified_pages 2; an arc
file reports clean false with complex-path/token fill and operator/token arc,
and --strict fails; a file without %!PS-Adobe fails with the missing-header
error.

Gates: cargo test -p pdfxi-cli --test cli create_postscript = 2 passed; cargo test
-p pdfxi-convert postscript_pdf = 4 passed; whole workspace fmt/clippy/tests
green.

Scope: documented text/line/rectangle subset, not an interpreter: curves,
arbitrary paths, images, transforms, colour spaces, non-standard fonts and DSC
includes are reported or rejected; no external Distiller/Ghostscript.
"""
