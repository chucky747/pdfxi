notes = "Header validation and version extraction are retained from T-0006 and now feed an eager structural parse. Classic-table PDFs from 1.0 through 1.4 parse (including /Prev chained sections for incremental updates); version-dependent features such as xref streams (1.5+) and 2.0 constructs are not yet implemented, so full 1.0-2.0 compatibility stays in-progress."
