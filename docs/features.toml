id = "VIEW-016"
notes = """
End-to-end open/render slice. `pdfxi-app` now depends on `pdfxi-render` and its
`pdfium` feature forwards to `pdfxi-render/pdfium`. `PdfxiApp::new()` opens
fixtures/minimal.pdf through `PdfiumRenderer` when `pdfium` is enabled (failures
are reported through status, never panics). `CanvasLayout` drives
`RasterCache::ensure_visible`, which renders the visible pages at the resolved
canvas scale into an LRU cache; `raster_texture` uploads the cached RGBA page
into a reusable egui texture that `canvas_ui` paints inside the page rectangle.
The cache and its tests are GUI-free and run under default features with a mock
renderer. Fixture resolution is documented in `raster::workspace_fixture_path`:
