[[feature]]
docs = [
    "docs/FEATURES.md",
    "crates/pdfxi-core/src/parser.rs",
    "crates/pdfxi-core/src/xref_tests.rs",
]
domain = "Standards"
evidence = "cargo test -p pdfxi-core (CARGO_TARGET_DIR=target/lanes/core): 75 passed, 0 failed (see test names above). cargo clippy -p pdfxi-core --all-targets -- -D warnings: clean. cargo fmt -p pdfxi-core --check: clean."
id = "STD-003"
notes = """
Implemented PDF 1.5+ cross-reference streams and object streams in pdfxi-core.
The parser now dispatches at startxref between classic tables and /Type /XRef
streams, decodes the stream with the existing bounded Flate pipeline (honoring
/DecodeParms), parses /W (widths capped at 8 bytes), /Index (or /Size),
/Root, /Prev and /Type, and reads the three big-endian entry fields including
type-2 (compressed) entries. /Prev chains may mix classic tables and streams;
entries merge newest-wins and revisiting an offset is rejected as XrefCycle.
/ObjStm streams are expanded on demand: /N, /First and the header pairs are
bounds-checked, the object number at the indexed slot is validated against the
type-2 entry, and the body is parsed lazily with a nesting-depth guard. The page
tree, page_text and save/save_incremental behavior for classic documents is
unchanged; saving an xref-stream input is now explicitly declined with
Error::UnsupportedState so compressed objects are never silently dropped.

SECURITY FIX (reviewer blocker on merged T-0023): PNG predictor reconstruction
in filter.rs now rejects row_length > decoded data length before allocating
`previous_row`, so a tiny valid zlib stream with a hostile /DecodeParms
(/Predictor 15 /Columns 4294967295) returns a structured MalformedDeflate error
instead of attempting a multi-gigabyte allocation. Regression test:
filter::tests::hostile_columns_is_rejected_before_allocating_predictor_row.
The /Columns -> row_length computation uses checked multiplication and the
