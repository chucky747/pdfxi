[[feature]]
docs = [
    "crates/pdfxi-automation/src/action_wizard.rs",
    "crates/pdfxi-automation/src/lib.rs",
    "docs/evidence/automation/T-0145.md",
]
domain = "Automation"
evidence = "cargo test -p pdfxi-automation: 164 passed, 0 failed (17 new action_wizard tests: sequence validation, duplicate/empty ids, bounded step count, deterministic plan order and sorted reasons, typed per-step deny reasons, unsupported kind, oversized script/budget overage, sandboxed script success, typed step-budget exhaustion, pre-cancellation, executor success/failure propagation, metadata step, command success/failure, denial skipping, determinism, typed codes), 0 doc tests; TEST_EXIT=0. fmt/clippy/doc all EXIT=0. Full output in docs/evidence/automation/T-0145.md."
id = "AUTO-004"
notes = """
The sandboxed Acrobat-compatible JavaScript subset is now bound to an Action
Wizard-style batch runner at library level. New module `pdfxi_automation::
action_wizard` adds:

- `ActionSequence` (named, ordered steps with a `ScriptBudget`) and
  `WizardStep`/`WizardStepKind` with three supported actions — `RunScript`
  (caller-supplied source for the existing parser/interpreter), `SetMetadata`
  (in-memory metadata), `RunCommand` (named automation command) — plus an
  `Unsupported` kind retained so unknown kinds are denied rather than guessed.
  Structural validation and `add_step` reject empty sequences, empty/duplicate
  step ids, and more than MAX_SEQUENCE_STEPS (64) steps.
- `plan_sequence` -> `RunnerPlan`/`StepPlan`/`PlanDecision`/`PlanDenyReason`: a
  deterministic, non-executing plan with one entry per step in insertion order
  and typed allow/deny reasons (empty sequence, duplicate/empty id, sequence too
  long, unsupported kind, empty/oversized script, empty metadata key,
  empty/disallowed command, budget field above host ceiling). Reasons are
  exhaustively collected, sorted, and deduplicated; summaries are stable.
- `ScriptStepExecutor` trait with `SandboxedScriptExecutor` default that calls
  the existing `Script::parse_with_limits`/`Script::run` with the step budget
  and the caller's `CancelToken`. No filesystem, network, process, clock,
  randomness, or ambient globals; step/fuel, call, loop, and string budgets are
  enforced by the sandbox and surface as typed `JsError`/`ScriptExecError`.
- `CommandHandler` trait with `RecordingCommandHandler` default: real command
  dispatch stays the caller's responsibility; the runner performs no I/O.
- `SequenceRunner`/`run_sequence` produce a deterministic `SequenceReport`
  with per-step `StepRunOutcome`, an in-memory metadata map, typed
  `WizardRunError`s, and byte-stable summaries. Denied steps are skipped
  without invoking an executor.

Verified at library level: this closes the "no Action Wizard binding" gap from
the prior AUTO-004 note. Honest remaining scope is outside this row's library
boundary: no UI Action Wizard editor and no CLI entry point exposing
`ActionSequence` (the CLI `action`/`droplet` commands still drive the older
`Action`/`BatchQueue` model, tracked by AUTO-001/AUTO-005); no real PDF mutation
by script steps (the JS sandbox stays capability-free and metadata is
in-memory); and command effects are owned by the caller through the trait
boundaries. No new dependency, unsafe, or non-test panic was introduced.
"""
priority = "P3"
