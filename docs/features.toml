id = "AUTO-007"
notes = """
A toolset is a versioned JSON document mapping a friendly alias to an action
file, an action name, and optional string parameter defaults. Aliases are
listed in sorted order and toolset JSON serializes canonically. Validation
rejects empty names/toolsets/aliases/file/action values, empty default keys,
unsupported versions, malformed shapes, and aliases in DANGEROUS_ALIASES
(case-insensitive, '-'/'_' equivalent: exec, shell, cmd, powershell, bash,
delete, format, security, custom-command, ...). Running an alias also rejects
target actions containing a Security or CustomCommand step
(dangerous_operation) so a friendly name cannot launder an unchecked
operation. Defaults are applied to steps that lack that parameter key;
existing values win. Honest scope: aliases select saved actions and stage
them through the same no-mutation executor; no shell/process execution and no
WASM plugin host (AUTO-008 remains out of scope).
"""
priority = "P2"
status = "verified"
tests = [
