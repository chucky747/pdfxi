`pdfxi form tabs <FILE> [--policy rows|columns|structure|annotations]
[--include-read-only] [--no-wrap] [--json]` reads the AcroForm /Tabs name
(default R), builds TabWidgets from each field's real widget rectangle and page
index, applies the requested or file policy, and reports the ordered widgets
(name, one-based page, rect, read-only) plus every field's next and previous
target. --include-read-only stops skipping read-only widgets and --no-wrap
stops at the ends.

`pdfxi form actions <FILE> [--json]` walks field and widget dictionaries, parses
/A and /AA entries (K, F, V, C) into the safe ResetForm/SubmitForm whitelist and
lists every rejected action with its site, subtype and reason. JavaScript and URI
actions are rejected, never parsed or executed.

