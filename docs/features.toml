domain = "Standards"
evidence = "docs/evidence/cli/T-0302.md"
id = "STD-006"
notes = """
Verified through `pdfxi structure apply <FILE> --out PATH --tree PATH [--json]`.

The tree is JSON: `lang`, `nodes` (id, role, page, optional bbox, text, alt,
actual_text, expansion, artifact, children) and `roots`. Roles accept model and
PDF names (P/Paragraph, H1/Heading1, TD/TableData, ...) and anything else is
rejected before the document is touched. A11yTree::new enforces unique ids, known
children, acyclic roots and reachable nodes; write_structure_tree enforces the
/ActualText, /E and artifact rules.

The host remaps the generated objects to fresh numbers after
allocate_object_number, resolves placeholder page references to real pages,
merges catalog /StructTreeRoot, /ParentTree, /Lang, /MarkInfo and
/ViewerPreferences, writes /StructParents on every page and appends each page's
marked-content overlay to /Contents. It saves, reopens and verifies that the
catalog root matches, /MarkInfo /Marked is true, /Lang exists, the root's
/ParentTree /Nums is non-empty, every /StructElem has /S, /P and a /Pg that is a
real page, the role count matches the writer and every role is known, every page
has /StructParents, and page text is unchanged. certification_claimed is always
false.

Evidence: minimal.pdf yields lang en-US, pages 1, nodes 3, struct_elements 3,
generated_objects 5, struct_tree_root 6, pages_tagged 1 and roles
Document,H1,P. pdfxi text still returns the original page text,
pdfxi accessibility check drops PDFUA1.NOT_MARKED, PDFUA1.NO_LANG and
PDFUA1.NO_STRUCT_TREE_ROOT leaving only the unrelated UA-0001 title finding, and
two runs are byte-identical. The real three-page powerpoint-slides.pdf tags all
three pages with roles Document,H1,H2,P and lang en-GB. Unknown roles, dangling
children, empty roots, out-of-range pages and an absent tree file are rejected;
the input file stays byte-identical.

Gates: cargo test -p pdfxi-cli --test cli structure_apply = 2 passed; cargo test
-p pdfxi-cli --bin pdfxi structure:: = 1 passed; whole workspace fmt/clippy/tests
green.

Scope: the tag tree comes from a JSON description rather than layout inference;
overlays are marked content only; PDF/UA is not certified and the title remains
the caller's responsibility.
"""
