# Real-world corpus manifest (T-0215).
#
# Every PDF in this directory is listed here. The smoke test
# `crates/pdfxi-testkit/tests/realworld_corpus.rs` verifies the SHA-256, opens
# the file through `pdfxi_core::Document`, checks the page count, and looks for
# the marker words in `Document::page_text`.
#
# Fields:
#   name          file name relative to fixtures/realworld/
#   producer      powerpoint | edge | pdfxi | excel
#   sha256        lower-case SHA-256 of the committed bytes
#   pages         expected leaf page count
#   markers       marker phrases expected in extracted page text
#   password      documented open password, when the file needs one
#   expected_error  optional pdfxi-core error variant asserted for page_text
#   known_failure  current pdfxi-core limitation, kept honest by the test
#
# `known_failure` entries assert today's failure instead of hiding it. When the
# parser is fixed, the assertion flips and the entry must be updated.

version = 1

[[fixture]]
name = "browser-print.pdf"
producer = "edge"
sha256 = "7a837a076e32ac768538009dca96785f0c25a42a205bd2f898f4d330934cf948"
pages = 1
markers = ["kestrel browser", "kestrel anchor"]
known_failure = "page_text returns glyph indices from the Edge subset font because the ToUnicode CMap is not applied; marker words are absent"

