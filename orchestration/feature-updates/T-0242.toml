notes = """
Adds pdfxi-edit and pdfxi-core to the app and enables Capability::Comments. The
rail shows the real annotation count; the panel lists entries by page with
subtype, snippet, author, date, resolved checkbox and delete; the page popup
shows the thread with reply/resolve/edit/delete and closes on Escape. Comment
arms a note tool that opens a draft on the next page click; Highlight converts
the selected spans to PDF quads per page and adds /Highlight annotations, or
shows a hint when nothing is selected. Every mutation runs the library on a
clone of the session document and commits it as one DocumentSession::edit, so
undo/redo, the dirty marker, save and reopen all see the annotations; reads
refresh after open, tab switch, undo/redo and each edit. Edit PDF moved behind a
new disabled Capability::Edit so Comments does not surface a dead control.
Two defects found and fixed while capturing: the text baseline was treated as
top-down (highlights landed at the page bottom) and a long comment label widened
the side panel into a black strip beside the canvas. New AppCommand variants:
AddNote, SaveNoteDraft, CancelNoteDraft, AddHighlight, OpenAnnotation,
CloseAnnotationPopup, ReplyToAnnotation, SetAnnotationResolved, UpdateAnnotation,
DeleteAnnotation. The date formatter uses the `time` crate (MIT OR
Apache-2.0) with `formatting`, `macros` and `local-offset`; `chrono` was removed
after RUSTSEC-2026-0543 so `cargo deny` stays clean.
"""
