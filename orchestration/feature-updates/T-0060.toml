notes = """
Completed the two forms-lane gaps that had kept FORMS-006 and FORMS-007 in
progress. XFDF import is implemented in a new, dependency-free `xfdf` module:
a bounded hand-written XML reader (XML declaration, comments, quoted attributes,
predefined and numeric entities, default or prefixed XFDF namespace with prefix
validation across the whole tree, nested field names joined with '.') feeds
`parse_xfdf` and `import_xfdf`. Because XFDF carries no type marker, `import_xfdf`
maps raw <value> strings against the target Form's field types: checkbox On/Off,
radio and choice selections by exact membership in declared choices/states
(so options named No/Off/0/False survive and undeclared Off deselects), text and
signature strings, and numbers preserved when the field already holds a number.
The resulting FdfDocument feeds straight into FormFill::fill_from_fdf. Malformed
XML, wrong namespaces, foreign prefixes, unknown entities, unknown fields, empty
field names, and over-full scalar fields produce typed XfdfError variants rather
than panics. Export remains the existing schema-compatible `export_xfdf`; export
and import together round-trip every FieldValue kind.

Flattening is implemented in a new `flatten` module over a small, documented
adapter model (FlatPage/FlatDocument, PageAnnotation::Widget/Other,
StoredAppearance). `flatten_page`/`flatten_document` select an appearance via an
AppearancePolicy (PreferStored with generated fallback by default; Generate;
StoredOnly), wrap it in a `q 1 0 0 1 x y cm … Q` translation to the widget's page
rectangle, append it to page content, remove widget annotations, and preserve
non-widget annotations and original content verbatim. The AcroForm dictionary is
removed only when at least one widget was actually flattened, so a non-empty form
whose widgets are absent from the supplied pages leaves the document completely
unchanged (no orphaned widgets on other pages). A document with no widgets is a
genuine byte-for-byte no-op. Output is deterministic.

Reviewer fixes applied after re-claim: (1) AcroForm removal now requires
flattened_widgets > 0 with a regression test; (2) choice/radio values map by
declared-choice membership, not off-like literal spelling; (3) namespace prefix
validation covers every element and attribute, not only the root; (4) strip_slash
rustdoc now says all leading slashes are trimmed; (5) test counts corrected.

Scope boundary (honest): this crate stays dependency-free behind the existing
FormSource-style adapter pattern; wiring these model types to a concrete PDF
object graph, writer, and arbitrary /Matrix or /Rotation appearance placement
belongs to a host crate and is not claimed here. The crate Cargo.toml gained the
already-workspace-locked `thiserror` dependency for the two new error enums; the
only Cargo.lock change is the single "thiserror 2.0.21" edge under the
pdfxi-forms package (no version changes). There are no unwrap/expect/panic or
unsafe blocks in the new non-test code, and every public item has rustdoc.
"""

