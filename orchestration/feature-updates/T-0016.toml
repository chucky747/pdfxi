notes = """
Created the M1 committed fixture corpus and golden harness. The
generate_fixtures example writes three small deterministic PDFs from the
existing builders: fixtures/minimal.pdf (minimal_pdf),
fixtures/text.pdf (text_pdf with a fixed synthetic string), and
fixtures/multipage-3.pdf (multipage_pdf(3)). fixtures/manifest.toml records each
file's SHA-256 digest, builder expression, page count, and text markers; the
digests were cross-checked against PowerShell Get-FileHash -Algorithm SHA256
and match byte-for-byte. A pure-Rust SHA-256 (FIPS 180-4) was added so the
test-only crate needs no new dependency and Cargo.lock is untouched; it passes
the standard empty/abc/hello-world vectors plus a multi-block vector.

committed_fixtures.rs integration tests read the on-disk fixtures, verify their
SHA-256 against the manifest, assert header/startxref/page-count/object-count/
text-marker structure, confirm the manifest covers every committed fixture, and
confirm the builders still reproduce the committed bytes. The golden module
provides GoldenImage (raw grayscale pixels, deterministic dimensions, no image
crate) with MAD/identical-fraction/matches/fingerprint comparisons and tests,
a foundation for future SSIM baselines. corpus/README.md and
corpus/manifest.toml define a checksum-fetch policy skeleton; no large corpus
is committed or downloaded.
"""

