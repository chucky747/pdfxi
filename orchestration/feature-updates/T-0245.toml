notes = """
Round B of the signing shell per ADR 0012. Capability::Signing is enabled, so the
same AppCommand::Sign (label "sign") is reachable from the command bar, the
Tools panel row and --tool=sign. The card picks a PKCS#12 container, imports it
with SigningIdentity::from_pfx, clears the password immediately, shows the
signer subject and chain length, and signs the active writable tab.

Signing draws a visible typed /Text appearance at the bottom-right of the page
(/NM pdfxi-signature-N) and then calls DocumentSession::sign with a first-free
Signature-N field name seeded from the document's /AcroForm /Fields signature
entries. The appearance is committed as one revision and the signature as a
second incremental revision that covers the appearance; the session API has no
single annotation-plus-sign call. Verified with verify_signature on the session
bytes: status, signer, SHA-256, time, whole-file coverage, appended-after-
signature, and chain trust shown honestly as "identity not verified" while the
trust store is absent (T-0267).

The E-signed badge predicate is Valid && bytes_match && covers_entire_file &&
!appended_after_signature, further scoped to the active tab and the byte state
(edits clear it). The green chip is a label above the typed note, drawn through
the existing page transform; the panel shows "Not checked for this document"
when the stored readout belongs to another tab. open_document_session calls
verify_signature_on_open once per opened document: a signed file shows the chip
and panel immediately under --tool=sign, an unsigned file clears the readout
with no error, and a malformed signature error is kept for that tab.

Tests: 544 lib passed + 24 harness, 4 ignored signing tests (real PFX fixture),
fmt and clippy clean. The ignored tests also reopen the signed bytes with
PdfiumRenderer (original page count, real page-0 geometry) and prove the typed
note is in the signed document; one flips a signed byte and asserts the badge
predicate becomes false.

Capture fixture: the ignored write_signed_capture_fixture leaves
target/tmp/signing/capture-signed.pdf (111330 bytes, SHA-256
B2D99AD720BAC8D4CC9E9ED1061C078285351556B25BAA1D7831C4C687BFCACD) for the
reviewer's four captures. No screenshots are committed yet.

Not promoted: SEC-005/FORMS-010 stay as they are because A-31 (request
signature by email and the returned-copy tracker) is still open; SEC-006
(timestamps/revocation) is T-0267. Other limits: verification not re-run after
save, no multi-signature list, PFX read and signing synchronous on the UI
thread (~0.1 s for the fixture), encrypted documents refuse signing.

A-25 (Fill & Sign placement, not a certificate signature): a separate Place
signature card and AppCommand::PlaceSignature ("place-signature"), with its own
signature_place state, so it never loads a PFX or calls DocumentSession::sign.
Type commits an "Approved" stamp 220x56 pt at the bottom-right of the active
page (add_stamp, contents = typed name, author = display name). Draw maps the
260x80 pt pad's normalized points into that rect as one /Ink stroke (add_ink,
width 1.5, contents "Signature"; read back as AnnotationKind::Pencil). Image
magic-detects PNG (89 50 4E 47) or JPEG (FF D8) bytes and embeds them with
content_edit::add_image; PNG alpha is ignored (library behavior). Each placement
is one session edit, so it is undoable, marks the document dirty, and survives
save/reopen. Placement is fixed at the bottom-right: no drag-to-place, free
position, resize or multi-page placement. Tests:
typed_signature_stamp_persists_through_save_and_reopen,
drawn_signature_adds_ink_and_persists,
image_signature_adds_page_content_and_persists (3 passed, 0 failed with
cargo test -p pdfxi-app --features ui,pdfium signature_place). Entry is the
command only: no Fill & Sign panel button or --tool alias dispatches
place-signature yet. A-31 remains open; no capture is claimed for this card and
no feature row is promoted.
"""
