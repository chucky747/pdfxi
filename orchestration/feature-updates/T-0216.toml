# T-0216 - apply ToUnicode CMaps in page_text for subset fonts
#
# Core text-extraction fix. One feature row (AUTO-010) gains behaviour, tests
# and evidence; no other row changes. Integrator must also apply the one-line
# manifest handoff recorded below, which lives in the QA-owned
# fixtures/realworld/** path and is therefore outside this claim.

task = "T-0216"
lane = "core"
status = "verified"
evidence = "docs/evidence/hardening/T-0216.md"
docs = [
    "crates/pdfxi-core/src/tounicode.rs",
    "crates/pdfxi-core/src/content.rs",
    "crates/pdfxi-core/src/lib.rs",
    "crates/pdfxi-core/tests/tounicode_text.rs",
    "docs/evidence/hardening/T-0216.md",
]
notes = """
`Document::page_text` now resolves the page `/Resources /Font` dictionary
(inline or indirect), decodes each font's `/ToUnicode` CMap with its filter
chain, and applies it to every `Tj`/`TJ`/`'`/`"` string while that font is
selected by `Tf`. The CMap parser implements ISO 32000-1 section 9.10.3
`begincodespacerange`, `beginbfchar`, `beginbfrange` with incremented string
destinations and with array destinations, UTF-16BE destinations including
surrogate pairs, 1-4 byte source codes, and U+FFFD for unmapped codes. Parsed
CMaps are cached per stream object in a document-scoped mutex, so multi-page
extraction parses each shared font once. `fixtures/realworld/browser-print.pdf`
(headless Edge, Type0/Identity-H subset fonts with Flate ToUnicode streams 35
and 39) now yields `kestrel browser` and `kestrel anchor` instead of glyph
codes; Excel and PowerPoint markers are unchanged. Fonts without a usable
ToUnicode stream keep the previous byte-for-byte fallback, and a malformed CMap
degrades to that fallback rather than failing extraction.
"""
tests = [
    "tounicode::tests::parses_bfchar_bfrange_and_arrays",
    "tounicode::tests::unmapped_codes_become_replacements_without_stalling",
    "tounicode::tests::parses_one_byte_codespace",
    "tounicode::tests::rejects_a_truncated_block",
    "tounicode::tests::increments_carry_across_destination_bytes",
    "tounicode::tests::bounds_the_mapping_table",
    "tounicode_text::page_text_applies_bfchar_bfrange_and_array_destinations",
    "tounicode_text::page_text_switches_fonts_with_tf",
    "tounicode_text::page_text_without_to_unicode_is_unchanged",
    "tounicode_text::browser_print_fixture_extracts_unicode_markers",
]

