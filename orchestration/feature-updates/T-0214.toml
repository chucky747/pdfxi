notes = """
crates/pdfxi-document now owns the open document per ADR 0010. DocumentSession
opens a path or memory buffer, detects a trailing /Encrypt name token in the
last 64 KiB with an alphanumeric delimiter check (so /EncryptMetadata does not
trigger), decrypts RC4/AES-128/AES-256 sources through
pdfxi_security::open_encrypted, and exposes decrypted plaintext bytes plus a
typed DecryptionReport. Missing and wrong passwords are typed
(PasswordRequired, WrongPassword). Incremental edit appends through
Document::save_incremental, records start_len, delta and before/after SHA-256,
and reparses the result; undo verifies the prefix hash and truncates to the
boundary; redo re-appends the stored delta. History is capped at 50 revisions,
drops the oldest, and reports it through a sticky flag. edit_full uses
Document::save, clears history, and returns UndoAcrossRewrite at the rewrite
boundary. Saves write a sibling temporary file, sync_all, then rename, so a
failure leaves the destination untouched; save compares length, mtime and
head/tail SHA-256 with the identity captured at load or last save and returns
ExternallyModified unless save_forced is used. Saving an encrypted session is
refused with EncryptedSaveUnsupported until re-encryption is wired (T-0238).
Handoff for the app lane: after each mutation the viewer reopens
session.bytes() through PDFium (this crate stays rendering-free). Six
integration tests cover the encrypted fixture (decrypt, page text, password
errors, save refusal), Excel 2019 incremental edit + undo/redo with text,
failed atomic save over a directory, external append detection + forced save,
a full rewrite boundary, and the 50-revision cap; two unit tests cover
/Encrypt detection.
"""
tests = [
    "session::tests::encrypt_detection_ignores_the_metadata_key",
