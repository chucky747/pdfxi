notes = """
The assistant panel is live in the three placements the acceptance image shows
(command-bar pill, Tools row, rail entry) behind AppCommand::AiAssistant, with
a connected conversation, Ask/Enter, Stop, page-citation chips that dispatch
GoToPage(page - 1), a per-document conversation that resets on tab change, and
a Connect/Disconnect card. Nothing is sent on panel open or typing; only an
explicit Ask builds and sends a prompt.

Grounding follows ADR 0013. The planned OpenCode client-MCP route was tested at
the protocol level against 2.3.2 with the test model opencode-go/hy4-flash-free:
the attach completes and the service lists all five tools, but the model never
receives tool schemas (tool_names=[], tool_calls=[], provider calls=[]) with
the pdfxi_* ruleset, unprefixed allows, attach-before-session and a second
prompt. The app therefore sends a bounded, fenced prompt excerpt instead:
DocumentSnapshot reads the active DocumentSession on the UI thread (file name
only, page count, up to 64 pages / 256K chars, selection, outline) and
prompt_excerpt(24_000) emits an untrusted-data instruction, an
<untrusted-document-text file="..." pages="1-N"> fence, document_info,
--- page N --- sections, a truncation marker and the included page range. A
forged case-insensitive closing tag inside a page becomes <\\/..., so a
hostile PDF cannot close the block. The session is still created locked: the
client checks 2.3.x, sends deny-* plus the five pdfxi_* allows, and verifies the
read-back; no shell, file, network, edit or MCP tool is wired. The document
text is untrusted, bounded and fenced, and no tool execution path exists.

Real-service proof: "What is the verification sentence on page 1?" answered
"The verification sentence on page 1 is: **amber compass lantern.**" with a
Page 1 chip - a sentence that exists only in the fixture. Four captures from
the release build against the local service (2.3.2, 57 models, hy4) at
docs/evidence/ui/t0253-assistant-{light,dark}-{windows,macos}.png summarize the
two-page fixture; light/macos shows Page 1 and Page 2 chips.

Help and book docs now describe the live behavior: the question plus a bounded
document excerpt go to the local OpenCode service only when the user asks, the
session has no shell/file/network tools, and the credential is memory-only and
dropped on disconnect. SEC-013 is promoted against the locked-session plus
fenced-excerpt design; the MCP/BudgetedTools path remains a library capability
that the app does not use.

Gates: fmt, clippy -D warnings, rustdoc -D warnings, cargo test -p pdfxi-app
--features ui,pdfium (537 lib + 24 harness, 0 failed) and the release build are
green.

Limits: the excerpt is 24K chars, so very large documents are partially
grounded and say which pages were included; there is no on-demand page fetch.
The client-MCP tools are not exposed to the model in this OpenCode build; if a
later version fixes that, revisit ADR 0013. T-0253 removed the T-0252 auto-probe
on panel open, so T-0252's --tool=ai capture recipe is historical (its evidence
file says so).
"""
