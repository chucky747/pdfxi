notes = """
Round A of the assistant panel per ADR 0011. The panel now has three placements
(command-bar pill, Tools row and rail entry) behind AppCommand::AiAssistant, a
connected conversation with question, answer, "Thinking..." plus Stop, an ask
box with Ask/Enter, and page-citation chips that dispatch GoToPage(page - 1).
Citations are parsed from answer text only (page 2, p. 2, [page 2], [p. 2]);
a chip past the page count is disabled. One T-0251 session is reused per
conversation and reset when the active tab changes, so messages never cross
documents. Only the typed question is sent: the loopback stub test asserts the
prompt body and that no document text, page text or file name is included.
Stop cancels the worker flag and drops the late result. The UI thread only
drains channels and repaints.

Dead-control gate: the panel no longer calls mutating methods from click
handlers. Six commands were added with stable labels - assistant-connect,
assistant-ask, assistant-stop, assistant-disconnect, assistant-select-model and
assistant-pair - and the Escape key handler dispatches AssistantStop instead of
calling the method. tests/ui_controls.rs: repository_shell_has_no_dead_controls
passes; the harness records the six variants in PENDING_COVERAGE (five can be
promoted to proven with a status/active_rail proof; assistant-select-model
needs a connected service). No allowlist entry was added.

Gates: fmt --check, clippy -D warnings, rustdoc -D warnings, and
cargo test -p pdfxi-app --features ui,pdfium (517 lib + 24 harness + 0
doctests, 0 failed) all green. Four captures were taken from the release build
against the real local OpenCode service (2.3.2, 57 models, test model
opencode-go/hy4-flash-free) at
docs/evidence/ui/t0253-assistant-{light,dark}-{windows,macos}.png. The capture
question is a greeting because Round A sends no document text; an earlier
"summarize" probe produced an invented absolute path and was discarded. The
panel composer was rebuilt so a measured footer cannot be pushed over the
storage meter; one Stop control remains.

Limits: no locked session, attach_locked_mcp or BudgetedTools (Round B); no
document text; no summary or key-insights presets; no streaming; SEC-013 not
promoted; shell/help.rs privacy text and docs/book/src/privacy.md remain stale
for the docs task. Session reuse and set_model are implemented but not yet
tested (the stub answers one prompt); Round B covers them with the locked
session. A-16 is only half served here: the ask/citation/stop UI is live, the
document-grounded answer is Round B. Evidence lives at
docs/evidence/ui/T-0253.md. T-0253 removed the T-0252 auto-probe, so T-0252's
`--tool=ai` capture recipe is historical; its evidence file now says so.
"""
