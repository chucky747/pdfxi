A-02: shell/notifications.rs adds Notification, NotificationStore and
NotificationsUiState backed by a capped (100), field-escaped TSV file at the
platform config path. notify_real_event records only events that actually
happened (open, save, export finish, signature requested/returned, print
finish) and never fails the action that raised it. Icon::Bell dispatches
ToggleNotifications and shows the unread count; the popover has a UTC timestamp
per row, an explicit "No notifications yet." empty state and Mark all read.
