notes = """
Export card: `ExportUiState` + `ExportChoice` in shell/export_card.rs.
AppCommand::Export calls handle_export_command: no document sets "Open a document
to export" and changes nothing; an open document shows the card under the Tools
panel with a format ComboBox, a JPEG quality slider (only when JPEG is offered),
the Export button and last-export/error lines. The picker lists only formats
ExportFormat::is_implemented() advertises, per the task note that an
unimplemented format is absent rather than a disabled ghost.

Export path: choose_export_path opens rfd with the chosen extension and the tab
stem; tests never touch rfd. export_document_to builds ExportOptions with the tab
title, TextPageSelection::All, the card DPI and JPEG quality, then calls
export_pdf once. export_to_path writes one part at the chosen path, or every
page part as <stem>-<part name>.<ext>; it creates missing parent directories,
sets last_path, and reports "Exported N page(s) to <path>". Typed converter and
I/O errors go to the card error and "Export failed: ..." status. Unsupported
findings (Office text flattening) are appended to the success status as
"<n> unsupported item(s), e.g. page N kind: detail".

Feature wiring: the app's `pdfium` feature now forwards
`pdfxi-convert/pdfium`, so `ExportFormat::Png/Jpeg::is_implemented()` is true
under `--features ui,pdfium` and all eight targets are offered. The picker still
filters on is_implemented(), so a build without pdfium shows six targets and
never a disabled ghost.

Tests: `every_export_choice_writes_real_bytes` opens
fixtures/realworld/microsoft-excel-2019-sample.pdf and, per choice, exports into
target/tmp/export-card/ and checks the real bytes: Text contains the fixture
marker "PDFXI"; Docx/Xlsx/Pptx start with "PK"; Html contains "<html" and the
document title; Rtf starts with "{\\rtf"; PNG starts with 89 50 4E 47 and JPEG
with FF D8; every choice asserts is_implemented() first.
`export_without_a_document_reports_it_and_does_not_open_the_card`
covers the no-document command and converter error. `a_missing_parent_directory_is_created`
covers nested output creation. `page_images_are_written_beside_the_chosen_path`
covers multi-part naming for PNG (doc-page-1.png and doc-page-2.png beside the
chosen path). Harness:
`export_command_opens_the_card_with_a_document_and_explains_without_one`
plus the existing Export entries in all_commands, the label set, the label
snapshot and the capability dispatch loop. The Export branch in commands.rs no
longer calls not_available.

