notes = """
Adds the Windows GDI print adapter in pdfxi_render::win_print and re-exports it
from the app's print model. The native dialog supplies printer, paper, page
range and copies; the pre-print panel supplies fit/actual and orientation.
Pages are measured at 72 DPI, rendered at the printer's LOGPIXELS scale, and
centred in HORZRES/VERTRES; landscape rotates portrait pages. Every GDI object
and the dialog's DEVMODE/DEVNAMES are freed, and cancelled or failed jobs call
AbortDoc. The UI adds a Print command bar button, Ctrl+P, a pre-print panel, a
worker thread with progress and between-page cancel, and refuses when the
document permissions deny printing. The render crate's unsafe lint changed from
forbid to deny so win_print can declare Win32 entry points directly; no new
dependency was added. Automated proof: one page printed to Microsoft Print to
PDF, reopened as one page with a 3600x4659 page image and non-blank ink. GDI
rasterizes, so the printed PDF has no text objects; the test asserts that
honestly instead of faking a text match.
"""
