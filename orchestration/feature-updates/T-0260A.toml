notes = """
T-0260A adds the redaction and edit fuzz targets using the existing harness
conventions. Both are #![no_main] libfuzzer_sys wrappers around plain bounded
functions that return pdfxi_testkit::fuzz::FuzzOutcome. Because this task owns
only fuzz/**, the plain functions live in a new pdfxi-fuzz-entry member of the
standalone fuzz workspace instead of crates/pdfxi-testkit/src/fuzz.rs; they reuse
FuzzOutcome and MAX_FUZZ_INPUT (16 KiB) so the shape is identical. The member has
no libfuzzer-sys dependency, so the deterministic runner builds on this host.

redaction drives pdfxi_edit::apply_redaction on real bytes, then a full
Document::save and reparse, verify_redaction, and pdfxi_security's
sanitize_document_full plus verify_sanitized (the content-removing path that
returns rewritten bytes). edit drives content_edit::text_blocks/list_objects and
document_annotations::add_highlight/add_text_note with input-derived page,
rect, point, and text, including the documented EmptyId and EmptyQuads
rejections. A parse failure returns normally in both.

Seeds are copies of fixtures/minimal.pdf plus one real fixture per corpus:
fixtures/text-hello.pdf for redaction and fixtures/authoring/authoring-
annotations.pdf for edit. fuzz/corpus/manifest.toml is unchanged because the
testkit test pins it byte for byte and it deliberately lists only generated
seeds; verify_corpus ignores unlisted files.

Verification: cargo test --manifest-path fuzz/entry/Cargo.toml -- --nocapture
=> 7 passed, 0 failed (4 seeds, 96 seeded-random inputs, 2 empty, 2 oversized;
redaction seeds 7 accepted / 0 rejected each, edit seeds 5 accepted / 2 rejected
each). The assertion tests prove the full-page mark on text-hello.pdf removes
the Hello run across save/reparse and that add_highlight persists an annotation.
cargo fmt --manifest-path fuzz/Cargo.toml --all -- --check and
cargo clippy --manifest-path fuzz/entry/Cargo.toml --all-targets -- -D warnings
are clean; cargo test -p pdfxi-testkit --test fuzz_smoke --test fuzz_seed_corpus
=> 11 passed.

Blocked: cargo check --manifest-path fuzz/Cargo.toml --all-targets fails in the
pre-existing libfuzzer-sys 0.4.13 C++ build (MSVC-only __pragma block rejected
by MinGW g++ 16.2.0 and by clang 23.1.3 targeting *-windows-gnu), and
cargo +nightly fuzz run reports "no such command: fuzz" (cargo-fuzz not
installed) while the MSVC nightly has no link.exe. Exact commands, errors, and
the next viable fuzz-host route are in
orchestration/blockers/T-0260A-fuzz-toolchain.md. No target was weakened.
"""