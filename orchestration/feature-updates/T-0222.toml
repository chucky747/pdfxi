notes = """
Adds pdfxi-document and pdfxi-security to the app. Each tab owns a
DocumentSession; open honours the 2 GiB cap and asks for a password on
PasswordRequired, retrying on WrongPassword and opening no tab on cancel.
Permissions decide read-only from the decryption report. The canvas renderer is
bound to the session bytes and keyed by (path, revision), so edit, undo and redo
re-rasterize. Save / Save As / Undo / Redo / CloseTab-with-prompt are wired to
Ctrl+S, Ctrl+Shift+S, Ctrl+Z, Ctrl+Y and Ctrl+Shift+Z; the tab title gains `*`
when dirty. ExternallyModified opens the Save As / overwrite dialog and a failed
save keeps the tab open. The Info title is edited through session.edit, which is
the proof used by the tests and by a capture-only --set-title= launch flag.
New commands: Save, SaveAs, Undo, Redo, SetDocumentTitle, SubmitPassword,
CancelPasswordPrompt, ResolveClose, OverwriteDocument, DismissSaveConflict.
Round B covers the bookmarks panel and the permission explanation UI.
"""
