notes = """
Round A: `TrustAnchorBundle` loads an explicit PEM or DER bundle and exposes
`certificate_chain_trusted`, which returns `Some(true)` only when the signer
path terminates byte-for-byte at a configured anchor, `Some(false)` when anchors
are configured but no path reaches one, and `None` when no anchors are
configured. `evaluate` carries the typed `TrustFailureReason` (expired,
not-yet-valid, unknown issuer, bad signature, CA/key-usage/path-length, unknown
critical extension). `RsaPkcs1Verifier` is a real PKCS#1 v1.5 verifier for
SHA-256/384/512 RSA issuer keys. No network and no host clock.

Real T-0249 PEM fixtures exposed two strict-parser bugs, fixed here and
regression-tested: 16-octet Windows serial numbers are now preserved
(`serial_number_bytes`, with the legacy `u64` accessor documented as a view),
and SAN/EKU extnValue was double-unwrapped and rejected every conforming
extension.

`CertificateStore` is an injectable abstraction over non-secret identity
metadata; `UnavailableCertificateStore` returns the typed
`WindowsStoreUnavailable`. Real Windows enumeration (CertOpenStore/CNG key
handles) is NOT implemented in this round: the crate has no `windows`
dependency and the shared lock file is integrator-owned. No test depends on the
host's installed certificates; store tests use injected fakes.

Not claimed: `SignatureVerification::certificate_chain_trusted` still reports
`None` until a later wiring task; RFC 3161 timestamp tokens, CRL/OCSP
revocation, and Windows store enumeration/key handles remain Round B. A-20 and
the security rows are not promoted.
"""
