notes = """
Integration-test gate in crates/pdfxi-app/tests/ui_controls.rs (20 tests). The
source-derived variant guard parses the AppCommand enum out of
src/shell/commands.rs and finds 92 variants; `all_commands()` covers 74 of them
and enumerates 18 as pending with a written reason. The guard fails when a
variant is missing from both lists (source_guard_reports_a_missing_variant
proves the failure path) and when a listed variant no longer exists. The
allowlist is exactly two entries (open-dialog, copy-selection), each with its
reason, and the guard asserts len() == 2. A Snapshot of every public accessor is
taken before/after dispatch; a command passes only if it changes tabs, page,
zoom, rotation, view mode, tool, find state, status, theme, window controls,
banner, errors, close policy, selection or thumbnails. Viewport-only commands
are proven through egui::Context::run. New since the first round:
dispatched_annotation_commands_act proves the comments commands,
save_note_draft_commits_and_cancels_the_public_draft proves the note draft is
public and reversible, and undo_redo_and_help_commands_act proves undo/redo and
the help window. The static scanner over src/shell/**.rs and src/ui.rs still
fails on a dead control, with positive/negative synthetic snippets. egui_kittest
was not needed and no dependency was added. Gates: `cargo fmt -p pdfxi-app --
--check` clean; `cargo test -p pdfxi-app --features ui,pdfium` = 473 lib + 20
integration passed. Clippy is clean for pdfxi-app; the full-workspace run is
temporarily red on an unrelated in-flight security lint, recorded in the
evidence.
"""
