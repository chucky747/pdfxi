notes = """
Added six deterministic, byte-stable M2 authoring fixtures under
fixtures/authoring/ plus fixtures/authoring-manifest.toml. The manifest records
each file's name, primary feature, searchable tags, page count, exact byte size,
and SHA-256. The generate_authoring_fixtures example is the single source of
truth: it writes the files and computes sizes/digests from the emitted bytes, so
the manifest cannot drift. Regeneration is byte-identical (tested).

Coverage: five page boxes with distinct values; /Rotate 90/180/270; a
/PageLabels number tree; /Text, /Highlight, /Link and /Widget annotation
dictionaries; an /AcroForm with /Tx, /Btn and /Ch fields; and a standard
security handler R2 encrypted sample. The encrypted fixture uses only the
documented public test password (user 'pdfxi-test', owner 'pdfxi-owner'); its
/O and /U entries are derived deterministically with a self-contained MD5 + RC4
implementation (no new dependency, no secret committed). The integration test
recomputes /U and proves the documented password is accepted while a wrong one
is rejected.

Golden helpers ContentSnapshot and PageTreeSnapshot normalize only documented
volatile fields: trailing content-stream whitespace and the /CreationDate,
/ModDate, /ID and /Producer dictionary keys. A test proves volatile additions
leave the page-tree fingerprint unchanged while a real box edit changes it.

pdfxi-core is a test-only (dev) dependency of pdfxi-testkit so every fixture is
parsed through the real Document parser. Cargo permits this because pdfxi-core
already dev-depends on pdfxi-testkit and both edges are dev-only; normal builds
are cycle-free (verified with cargo check -p pdfxi-testkit --tests).

No unsafe, no unwrap/expect/panic in non-test code, no new external dependency,
and docs/features.toml was not edited. Workspace-wide fmt/clippy currently fail
only on in-progress files in the automation and render lanes (outside this
claim); the qa crate itself is clean on fmt, clippy, tests, and docs.
