notes = """
Round B closes the inline-image gap. `content_edit::tokenize` now retains each
inline image's `BI..ID..EI` object: the direct dictionary entries, the exact
sample byte range (after `ID` and its single white-space, before the white-space
preceding `EI`), and the offset just past `EI`. Unfiltered images derive their
length from `/W /H /BPC /CS`, so binary sample bytes that spell `EI` cannot move
the span; filtered images use the PDF terminator rule (white-space before `EI`,
white-space/delimiter/EOF after it). A declared-but-mismatched length is marked
uncertain and fails closed.

An intersecting inline image is mapped into page space through the current CTM
(the form matrix is already composed for inline images inside forms), decoded
through the same helper path as image XObjects, pixel-filled with opaque black
through the inverse transform, and re-encoded as deterministic unfiltered
8-bit samples in place. Supported: raw 8-bit DeviceGray/G, DeviceRGB/RGB,
Indexed (palette expanded to RGB) and DCTDecode JPEG. `keep_images = true`
reports `<inline image>` and `clean = false`. Unsupported filters/formats, an
unclear sample span or a non-invertible placement return typed
`UnsupportedImage` before any staging. An image outside every mark is untouched
byte-for-byte. PDFium re-render proves the marked ink is gone; no app shell is
exposed, so EDIT-013 remains `library`.

Reviewer follow-ups: indirect form `/Matrix` and `/BBox` are resolved through the
effective document; a present malformed `/Matrix` returns `UnsupportedForm`, and
an absent/malformed `/BBox` is treated as possibly intersecting so the form is
never silently skipped. Unresolvable XObjects have no trustworthy placement, so
they fail closed whenever the page carries a mark (or the CTM is not invertible)
rather than being skipped via the unit-square heuristic. Vector paths remain a
known limit: they are not removed and do not make `report.clean` false.
"""
