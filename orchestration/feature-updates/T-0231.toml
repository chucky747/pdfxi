notes = """
Organize Pages (shell/organize_card.rs): OrganizeUiState and
handle_organize_command. AppCommand::Organize ("organize") says "Open a
document to organize" with no document and otherwise opens the Organize Pages
window. While it is open, a thumbnail click toggles the page under Ctrl or
selects a range under Shift; outside the card the same click navigates as
before.

The card offers Rotate left/right, Delete, Move up/down, Extract selected,
Split each page and Combine Files. Every mutation clones the session Document,
builds a pdfxi_core::pages::PagePlan and applies it with apply_page_plan,
reparses the bytes, commits through session.edit and calls after_session_edit.
Rotate uses RotationTarget::Indices(selection); Delete extracts the complement;
Move swaps the selected index with its neighbour; Extract writes
<stem>-extract.pdf and opens it; Split writes one <stem>-page-N.pdf per page.
This is a full rewrite (fresh object numbers), so it marks the tab dirty and
undo does not cross the rewrite boundary (ADR 0010, point 5).

Combine Files: AppCommand::CombineFiles ("combine-files") opens a window with
Add files (rfd PDF multi-select), per-row Remove, an output path (default
combined.pdf) and Combine. combine_to_path reads each PDF into a Document,
builds PagePlan::merge(documents[1..]), applies it to the first document, writes
and opens the result, returning the page count. Fewer than two sources is a
typed error that writes nothing.

Tests: twelve organize_card unit tests run on real fixture bytes and reopen the
written PDFs with pdfxi_core::Document; the harness test proves both commands
open their cards on a real document. fmt exit 0; clippy exit 0;
cargo test -p pdfxi-app --features ui,pdfium = lib 606 passed / 0 failed /
4 ignored, ui_controls 34 passed, organize_card filter 12 passed.

Limits: drag reorder is button-based move up/down, not pointer drag-and-drop;
insert blank page and add page from file are not exposed; extract/split/combine
write new files that undo does not cover; no page-range selection or image
sources for combine; no capture is claimed (T-0262 captures the installed
build).
"""
