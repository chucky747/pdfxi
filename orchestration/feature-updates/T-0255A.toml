notes = """
Adds the document-backed bridge the T-0255 blocker named. `read_outline` walks
the catalog /Outlines /First//Next tree through `pdfxi_core::Document`,
resolves /Dest and /A /D page references (references or integer indices) to
zero-based page indexes through `Document::pages()`, and resolves named
destinations through catalog /Dests and /Names /Dests. Unresolvable
destinations stay honest: the bookmark is kept with no destination and an
`OutlineIssue` names the reason. A finite f64 coordinate that overflows f32
(such as 1e39) is narrowed first and reported as an `OutlineIssue` rather than
accepted as an infinite fit. Cyclic, dangling, wrong-parent or malformed
linked lists return typed `OutlineReadError`; item and depth budgets bound the
walk.

`write_outline` installs the edited `Outline` as a real catalog /Outlines
linked list with /Parent, /First, /Last, /Count, /Next, /Prev and
`[page_reference /Fit ...]` destinations. It reuses an existing indirect
outline object id, creates /Outlines on first add, preserves unrelated catalog
entries and never changes page objects/ids. Titles, page ranges and finite
coordinates are validated before any object is staged, so an invalid outline
leaves `document.save()` bytes byte-identical; regression tests cover an
out-of-range page and a NaN coordinate.

Round trip on `fixtures/realworld/powerpoint-slides.pdf`: read, add a root and
a child, close the parent, rename one item, move another, write, save, reopen.
PDFXI asserts the order (Prelude, Slide 3, Slide 1, Harbor renamed), pages
(0, 2, 0, 1), the closed /Count -1 and every /Parent//Prev link. PDFium opens
the saved bytes, reports 3 pages and reads every page; this workspace's PDFium
binding exposes no bookmark traversal, so PDFium is the independent validity
check and PDFXI asserts the outline.

`fixtures/realworld/microsoft-excel-2019-sample.pdf` has no /Outlines; the test
adds one, asserts the new entry, and confirms every original catalog key and
every page object id is preserved.

