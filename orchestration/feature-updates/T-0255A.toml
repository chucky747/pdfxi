`RUSTDOCFLAGS=-D warnings cargo doc -p pdfxi-edit --no-deps` clean; `cargo test
-p pdfxi-edit` 404 passed (358 lib + 5 object_render + 13 real annotations + 27
redaction + 1 text_render), 0 failed. No app lane, no orchestration change
outside this fragment, no git.
