notes = """
Round A of the assistant shell per ADR 0011. Capability::AssistantConnect is
always available, while Capability::AiAssistant is added only for a usable
connected service. The command bar, Tools panel and rail dispatch the same
AppCommand::AiAssistant and open a real Connect screen with Disconnected,
Checking, Connected, Incompatible and Unreachable states. The connected state
shows the service URL (no credentials), OpenCode version, provider labels and
clickable model rows; the default and acceptance model is
opencode-go/hy4-flash-free. Model and last endpoint persist in settings; the
password/token/pairing code never does. Pairing uses the T-0251 explicit
endpoint with the code as the credential because the client has no
POST /api/pair handshake; the panel states that limit.

Only /api/info, /api/provider and /api/model are called during a probe. No
session, prompt, document text or tool call is sent. Four captures show the
connected real service in light/dark x Windows/macOS. Tests: 503 lib + 24
harness, clippy/fmt/release green. Limits: no chat panel, streaming, summary,
insights, citations or stop control (T-0253); no native pair handshake; the
model picker changes the remembered model only, because no conversation exists
yet. No matrix promotion; SEC-013 stays as the library leaves it.
