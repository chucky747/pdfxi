notes = """
Protect card (shell/protect_card.rs): ProtectUiState and
handle_protect_command. AppCommand::Protect ("protect") opens the Protect PDF
window with masked user/owner password fields, permission checkboxes
(print/copy/annotate/forms), "Protect and save as..." and a Remove protection
section. protect_to_path calls pdfxi_security::protect_document with
ProtectOptions built from the fields (permissions mapped from the checkboxes,
owner password only when non-empty) and writes the bytes; the result is checked
with open_encrypted for the correct role, source page count and exactly the
selected permission grants. remove_protection_from removes with the supplied
password and writes/opens a <stem>-unprotected.pdf copy.

Redact card (shell/redact_card.rs): RedactUiState and handle_redact_command.
AppCommand::Redact ("redact") opens the Redact and sanitize window. Redaction
is gated on a non-empty selection: each selection quad becomes a RedactionMark,
apply_redaction runs on a cloned document, verify_redaction must report clean,
and the candidate is saved with save() (full rewrite, never incremental) to a
new <stem>-redacted.pdf that is opened as a new tab; the source is never
overwritten. Sanitize calls
pdfxi_security::sanitize_verified::sanitize_document_full with
SanitizeRequest::all() and writes/opens <stem>-sanitized.pdf.

Gates (target/lanes/app9): cargo fmt -p pdfxi-app exit 0; cargo clippy
-p pdfxi-app --all-targets --features ui,pdfium -- -D warnings exit 0;
cargo test -p pdfxi-app --features ui,pdfium = lib 585 passed / 0 failed /
4 ignored, ui_controls 32 passed, protect_card filter 4 passed, redact_card
filter 3 passed. Harness dispatch tests cover Protect and Redact with and
without a document; both commands stay in all_commands, the proven labels, the
label snapshot and the capability loop.

