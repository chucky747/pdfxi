notes = """
Library scope: `sanitize_document_full(&Document, &SanitizeRequest)` clears the
trailer `/Info`, detaches catalog `/Metadata`, removes `/Names /EmbeddedFiles`
attachments with their file specs and embedded streams, removes catalog/page/
annotation `/AA`, `/OpenAction`, `/Names /JavaScript` and every JavaScript
action object, flattens visible `/OCProperties` (default-hidden layers fail
closed with `UnsafeOptionalContent`), and removes `/Thumb` thumbnails. Every
pass is a full `Document::save()` rewrite; a second pass over the reparsed
classic output catches orphan category objects. A selected category that still
survives returns `SanitizeResidual` and no bytes. Referenced child objects are
nulled before keys are detached, so removed bytes do not remain in the output.

`verify_sanitized(bytes, secrets)` is independent of the removal code: it
reparses, re-extracts page text, scans the whole file and every text-candidate
stored/Flate stream in UTF-8 and UTF-16LE, reports undecodable candidates as
`UnreadableStream`, and re-derives the category inventory. Survivors identify a
page, object number, category and secret index, never secret text or document
content. PDFium is a second reader through the optional `pdfium` feature; it
reopens the sanitized real fixture, extracts the surviving text and sees no
title or author. A negative test proves an outside secret makes verification
dirty. Round A limits: hidden optional-content layers need a content rewrite and
fail closed; visible layers are flattened; untyped unreferenced streams are not
detectable attachments. No UI/CLI entry point; SEC-008/SEC-009 stay `library`
until T-0263.
"""
