notes = """
Round A adds Underline, StrikeOut and Ink annotations through the
pdfxi-document annotation model. Underline/StrikeOut write /QuadPoints, /Rect,
colour (/C), opacity (/CA), author (/T), date (/M), /NM, /BS << /W 1 /S /S >>
and an indirect /AP /N form XObject that strokes one line per quad (half a
stroke above the bottom edge, or the vertical middle) with butt caps. Ink
writes /InkList, /BS stroke width, the expanded /Rect (point bounds + width/2 +
0.5) and a stroked appearance with round caps and joins; a one-point path is a
degenerate round-capped subpath (dot rendering is viewer-dependent and
untested). Validation (MAX_MARKUP_QUADS 4096, MAX_INK_PATHS 256,
MAX_INK_POINTS 8192, width 0.1..=32.0, finite and in-media-box coordinates)
runs before any object allocation, so rejected input leaves /Annots and the
object-number space unchanged. AnnotationView gained kind, quads, ink_paths,
colour and stroke_width. AnnotationSubtype remains Text | Highlight | Other so
the app's exhaustive subtype_label match stays green; the new kinds are exposed
through AnnotationView::kind and render as Other("<Name>") in the current shell,
so a later shell task should switch subtype_label/subtype_icon to view.kind.
PDFium proof on page 1 of the real fixture: 228/456/1153 changed pixels inside
the three rects and 0 outside. Round A gates: 383 tests (341 lib, 5 object, 9
annotations, 27 redaction, 1 text) with fmt, clippy -D warnings and rustdoc -D
warnings clean. Artifact target/lanes/author7/t0247-out/markup.pdf, 96477 bytes,
SHA-256 CA68282144D097C2B2EF8513DB18B220DAD1B31AC764676A86EBEC387CAC6004 (the
/M dates carry the run time, so a rerun changes the hash but not the size).

Round B adds Line (with an open arrowhead), Square, Circle (ellipse), Polygon
and Stamp annotations plus a validated ShapeStyle. Line writes /L and
/LE [/None /OpenArrow] and draws the segment and two arrow legs; Square uses
/Subtype /Square; Circle draws the ellipse with four cubic Bezier segments;
Polygon writes /Vertices and closes the path with h. /IC is written only when a
fill colour is supplied (never for a line). Every shape writes /C, /CA, /F 4,
/BS, /T, /M, /NM, /Contents and an indirect /AP /N form XObject; the derived
/Rect (geometry bounds expanded by half the stroke width, plus ARROW_HEAD_LENGTH
for lines) is normalized and must stay inside the page media box. Stamp writes
/Name (canonical casing from the 14 standard ISO 32000-1 names), exact
/Contents, and a vector bordered label using the standard Helvetica font with
no external image; the drawn label is sanitized to printable ASCII and escaped,
while /Contents keeps the hostile text intact. Caps: MAX_POLYGON_VERTICES 4096,
MAX_STAMP_TEXT_CHARS 200, shape width 0.1..=32.0, colour components and opacity
finite and in 0.0..=1.0. New typed errors: DegenerateLine, EmptyShapeRect,
DegeneratePolygon, TooManyVertices, InvalidColorComponent, InvalidOpacity,
InvalidStampName, StampTextTooLong, all returned before mutation.
