notes = """
Edit PDF tool (shell/edit_tool.rs): EditToolState, EditSelection, Handle,
DragMode and the EditDocument handler. AppCommand::EditDocument ("edit-document")
toggles the tool: with no document it reports "Open a document to edit"; with a
document it activates and reports "Edit PDF: click an object", and a second
dispatch returns to the plain view.

Canvas: while active, a click hit-tests content_edit::list_objects on the page
(page_point converted from the canvas' top-left y-down frame into PDF y-up) and
selects the topmost object by list position, so a positional id can never go
stale between edits. The selection rectangle and four corner handles are drawn
over the page. Dragging the body calls move_object; dragging a corner calls
resize_object with scales anchored at the object's lower-left origin; Delete
calls delete_object. Every mutation clones the session document, runs the
library call on the clone, commits it as one session.edit, and refreshes with
after_session_edit.

In-place text (A-17): a double-click selects the object and, for a text block,
prefills the card's multiline editor from content_edit::text_blocks. Apply text
calls replace_object(.., ObjectReplacement::Text(..)), which reflows the block
at its existing width and font rules through the library paragraph path; the
selection clears and the status reads "Edit PDF: text replaced".

Add image (A-23): the card's Add image opens an rfd picker filtered to
png/jpg/jpeg. load_image_file reads the file, identifies PNG or JPEG by magic
bytes, and arms the next canvas click; that click calls add_image with a
120-point square centred on the click and clamped to the page. Tests build an
8x8 RGB PNG in memory so the placement path runs without a dialog.
"""
