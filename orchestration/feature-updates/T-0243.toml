# T-0243 Round A - Forms UI: field widgets and Fill & Sign
#
# Round A scope: enable Capability::Forms, list the tool only for a document
# with an AcroForm, read the real /AcroForm into a cached model, draw text and
# checkbox widgets at their real page rectangles, fill through AppCommand,
# undo/redo, save and reopen with appearances, and prove the appearance with an
# independent PDFium render.
#
# Round B (choice/radio interaction, tab order, apply/reset, flatten, FDF/XFDF)
# is NOT part of this round, so FORMS-001, FORMS-006 and FORMS-007 stay
# `library` until it lands: this fragment deliberately promotes no row.
# The matrix rows are listed in `feature_rows` only so the integrator can see
# which rows this task will eventually carry.

task = "T-0243"
lane = "app"
status = "in_progress"
evidence = "docs/evidence/ui/T-0243.md"
docs = [
    "crates/pdfxi-app/Cargo.toml",
    "crates/pdfxi-app/src/settings.rs",
    "crates/pdfxi-app/src/shell/forms.rs",
    "crates/pdfxi-app/src/shell/mod.rs",
    "crates/pdfxi-app/src/shell/commands.rs",
    "crates/pdfxi-app/src/shell/capabilities.rs",
