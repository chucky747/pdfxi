notes = """
Round A of the forms shell pair (ADR 0012) is unchanged: Capability::Forms is
enabled, the Tools row appears only for a document with an AcroForm, text and
checkbox widgets are drawn at their real /Rect and filled through AppCommand
dispatch, and each commit is one DocumentSession::edit with library-generated
appearances. after_session_edit refreshes the cached model on open, tab switch,
undo and redo. --tool=fill dispatches the same FillAndSign command as the row.

Round B completes O-05:

* Choice fields: a click dispatches FocusFormWidget, whose handler opens an
  option popup built from the cached model's /Opt entries; each option and the
  Clear action dispatch SetFormChoice -> pdfxi_forms::set_choice (or its
  reported form). A value outside /Opt is refused unless CHOICE_EDIT is set;
  an editable combo also exposes a text box. The selected value, widget /AS
  and regenerated /AP survive save and reopen, and PDFium renders ink in the
  selected choice rectangle.
* Radio groups: clicking a widget dispatches SetFormRadio with that widget's
  named on-state -> pdfxi_forms::set_radio. The library writes the group /V,
  the selected widget /AS and regenerates every widget's appearance, so no
  widget keeps a stale on-state. An unknown on-state is refused with a typed
  hint. A real two-widget radio group is generated onto the committed fixture
  with pdfxi_core objects for the test and the captures (not faked in the
  overlay).
* Tab order: widget_order(model) walks fields in document order and each
  field's widgets in order, skipping pushbuttons and signatures;
  focus_transition(order, current, forward) wraps at both ends. Both are pure
  and unit-tested without OS input. The canvas consumes Tab / Shift+Tab, draws
  a visible focus ring, activates checkbox/radio with Enter or Space, and lets
  Escape leave the field; typing goes to the focused text/editable-choice
  field.
* Apply and reset: Apply is rendered only while a draft differs from the field
  value, so there is no no-op button. Reset has no document-level library API,
  so the app walks the model, maps every FormField::default_value to the typed
  setter for its kind, keeps a per-field Result, and commits one session edit:
  one Undo step restores all fields. Per-field refusals are reported, not
  silently skipped.
* Flatten: a two-click confirmation dispatches FlattenForm -> pdfxi_forms::flatten,
  reports FlattenFormReport counts in the status and panel, and goes through
  the normal session edit path. An explicit gate refuses read-only documents
  and documents without a form. Save/reopen proves the AcroForm is gone while
  the text and choice appearances still render.
* FDF/XFDF: four panel commands open native rfd open/save dialogs. Each dialog
  command forwards to a testable explicit-path method (import_xfdf_at,
  export_xfdf_at, import_fdf_at, export_fdf_at); a headless dispatch reaches
  that method and reports its typed NoPath error instead of blocking. Paths
  are taken only from the dialog result; directories and inputs over 8 MiB are
  rejected. XFDF uses document_form::export_xfdf/import_xfdf (unknown fields
  fail, one undo step). FDF import parses with import_fdf and applies every
  FdfField by kind through the document setters; export builds a legacy Form
  with Form::from_fields and Field::new/with_value, carrying raw /Ff flags so
  NO_EXPORT fields are skipped. No network is used.

New AppCommand variants: SetFormChoice, SetFormRadio, ApplyFormEdit,
ResetFormFields, FlattenForm, FocusFormWidget, ImportXfdfDialog,
ExportXfdfDialog, ImportFdfDialog, ExportFdfDialog, with stable labels. The
no-dead-controls harness covers each with a real dispatch assertion; none were
allowlisted.

Gate: cargo fmt -p pdfxi-app -- --check EXIT=0; cargo clippy -p pdfxi-app
--all-targets --features ui,pdfium -- -D warnings EXIT=0 (exact gate, full
dependency graph); cargo test -p pdfxi-app --features ui,pdfium = 494 lib +
24 harness passed, 0 failed. Release build of pdfxi-ui with ui,pdfium EXIT=0;
pdfium.dll copied beside the binary; all four Round B captures verified.

FORMS-004 note: the row was `model`, not `library`. The app now proves the
tab-order half (widget_order/focus_transition, focus ring, Tab/Escape/Enter/
Space); the /AA actions half stays model-level and is not claimed by this
fragment. The integrator may keep the row split if it prefers.
"""

