notes = """
Library result: 66 offline tests pass (49 unit, 13 stub, 3 MCP, 1 doctest) and
two live tests are #[ignore]. Discovery reads
<USERPROFILE|HOME>/.local/state/opencode/service.json at runtime, accepts only
loopback registrations, and requires https for an explicit remote override;
the credential is redacted in Debug and every error. HTTP is blocking ureq with
rustls, ring and operating-system roots from rustls-native-certs (webpki roots
were removed because CDLA-Permissive-2.0 is not allowlisted), redirects are
never followed, every phase has a timeout and every call takes a CancelFlag.
Routes are pinned to 2.3.2: info, provider, model, session create, prompt,
message read, model switch and a live-only SSE stream. Round B attaches as a
client MCP over a Basic-authenticated loopback WebSocket: initialize with
protocolVersion 2025-11-25 and serverInfo pdfxi, notifications/initialized,
tools/list and tools/call for the read-only document tools document_info,
page_text, search, selection and outline, with -32601/-32602/-32002 JSON-RPC
errors, isError tool failures and a 64 KiB tool-text cap. Live on 2.3.2 the
service requested tools/list immediately after notifications/initialized
(3 messages, 5 tools advertised, no tool call) and the single generation on
opencode-go/hy4-flash-free returned "pong". Not done: session create with a
Permission.Ruleset, interrupt-based cancellation, and any UI. T-0252/T-0253 own
the Connect screen and the assistant panel; they should use
Assistant::attach_client_mcp and keep to the five read-only tools.
"""
