[package]
name = "pdfxi-render"
description = "Rendering abstraction, PDFium backend, display lists, tiles, fonts, and color."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
# Dependency-light sibling crate that owns the text model. `pdfxi-text` only
# depends on `thiserror` and never on `pdfxi-render`, so this edge cannot form a
# dependency cycle. It is a normal (non-optional) dependency because the
# backend-agnostic conversion helpers in `text_extract` are useful and tested
# in default builds; the native PDFium bindings remain optional below.
pdfxi-text = { workspace = true }
# Optional native backend. Default builds stay dependency-light; only the
# `pdfium` feature pulls in the PDFium bindings.
pdfium-render = { version = "0.9.5", optional = true }

[features]
default = []
# Enable the PDFium-backed `PdfiumRenderer`. Requires a PDFium library at
# runtime (see `PDFIUM_PATH` or the standard per-user install location).
pdfium = ["dep:pdfium-render"]

[dev-dependencies]
# T-0256 independent-reader check: protect with the security library, then open
# the result with PDFium through `tests/pdfium_protected.rs`.
pdfxi-core = { workspace = true }
pdfxi-security = { workspace = true }