[package]
name = "pdfxi-render"
description = "Rendering abstraction, PDFium backend, display lists, tiles, fonts, and color."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
# Optional native backend. Default builds stay dependency-light; only the
# `pdfium` feature pulls in the PDFium bindings.
pdfium-render = { version = "0.9.5", optional = true }

[features]
default = []
# Enable the PDFium-backed `PdfiumRenderer`. Requires a PDFium library at
# runtime (see `PDFIUM_PATH` or the standard per-user install location).
pdfium = ["dep:pdfium-render"]
