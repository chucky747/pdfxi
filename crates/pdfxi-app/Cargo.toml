[package]
name = "pdfxi-app"
description = "Desktop application shell, document tabs, toolsets, panels, and canvas."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false
build = "build.rs"

[features]
default = []
# The native egui/eframe viewer shell. Default builds stay dependency-light;
# enabling `ui` pulls in the GUI stack (winit, egui, and the raster upload path).
ui = [
    "dep:eframe",
    "dep:egui",
    "dep:rfd",
    "dep:pdfxi-assistant",
    "dep:pdfxi-convert",
    "dep:pdfxi-document",
    "dep:pdfxi-edit",
    "dep:pdfxi-core",
    "dep:pdfxi-forms",
    "dep:pdfxi-security",
    "dep:time",
]
# Enables the native PDFium backend inside `pdfxi-render`. This is independent
# of `ui` so the raster cache can be exercised headlessly, and `ui` keeps working
# without it by drawing the placeholder canvas.
pdfium = ["pdfxi-render/pdfium", "dep:pdfxi-convert", "pdfxi-convert/pdfium"]

[dependencies]
# Rendering is a normal (non-optional) dependency: the dependency-light raster
# cache uses only the backend-agnostic `pdfxi-render` contracts. Native PDFium
# is pulled in only through the `pdfium` feature above.
pdfxi-render = { workspace = true }
pdfxi-text = { workspace = true }
pdfxi-document = { workspace = true, optional = true }
pdfxi-core = { workspace = true, optional = true }
pdfxi-security = { workspace = true, optional = true }
# Export encoders used by the Export card (A-27). The app's `pdfium` feature
# forwards `pdfxi-convert/pdfium` for PNG/JPEG export.
pdfxi-convert = { workspace = true, optional = true }
pdfxi-edit = { path = "../pdfxi-edit", version = "0.1.0", optional = true }
# AcroForm reading, filling and appearance regeneration (T-0234). The shell
# calls these entry points and never parses a field dictionary itself.
pdfxi-forms = { path = "../pdfxi-forms", version = "0.1.0", optional = true }
# OpenCode assistant client (T-0251). The shell calls its T-0251 API only; it
# never builds a request or route of its own. T-0252 uses discovery, info,
# provider and model listing; sessions arrive with T-0253.
pdfxi-assistant = { workspace = true, optional = true }
# Calendar formatting and local offsets for annotation dates. MIT OR Apache-2.0.
# `chrono` was removed after RUSTSEC-2026-0543 (unmaintained).
time = { version = "0.3", optional = true, default-features = false, features = [
    "std",
    "formatting",
    "macros",
    "local-offset",
] }
thiserror.workspace = true
# Native file picker for Open (MIT). Only the `ui` shell calls it, so it is
# optional: a build without `ui` links no picker and emits no unused-dependency
# warning.
rfd = { version = "0.15", optional = true }
# Persisted settings and the launch-flag parser; both are already in the
# workspace lockfile (MIT OR Apache-2.0).
serde.workspace = true
toml.workspace = true
eframe = { version = "0.33", optional = true }
egui = { version = "0.33", optional = true }

[[bin]]
name = "pdfxi-ui"
path = "src/bin/pdfxi-ui.rs"
required-features = ["ui"]

[dev-dependencies]
# Unit tests parse pinned service JSON into the T-0251 model types. Test-only.
serde_json.workspace = true
# Widget-level tests drive real egui widgets and AccessKit names. Test-only.
egui_kittest = "0.33"
