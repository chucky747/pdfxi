[package]
name = "pdfxi-convert"
description = "Import and export converters for images, text, HTML, Office formats, and print capture."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Typed, actionable errors for the PDF-creation module (T-0058). `thiserror` is
# already a workspace dependency and is present in the lockfile; it only adds a
# derive macro and does not change the runtime dependency graph.
thiserror.workspace = true
# Renderer-facing page-image export is gated behind the `renderer` feature so
# consumers that only need format classification or the pure image encoders can
# stay dependency-free with `--no-default-features`. `pdfxi-render` itself keeps
# default builds free of native PDFium; the `pdfium` feature opts into the
# convenience path that constructs a `PdfiumRenderer`.
pdfxi-render = { path = "../pdfxi-render", optional = true }
# Accessibility tree and reading-order model consumed by the tagged-text
# exporter (T-0066). It is a workspace crate with no third-party dependencies,
# so this adds no external package to the lockfile.
pdfxi-accessibility = { path = "../pdfxi-accessibility" }

[dev-dependencies]
# Used only by integration tests to round-trip the generated bytes through the
# real parser. `pdfxi-core` is a workspace crate, so this adds no external
# dependency and no lockfile package not already present.
pdfxi-core = { path = "../pdfxi-core" }

[features]
default = ["renderer"]
# Expose `export_pages`, `ImageExportPlan`, `PageSelection`, and `ExportedImage`.
renderer = ["dep:pdfxi-render"]
# Add `export_pdf_bytes` / `export_pdf_file`, which construct a `PdfiumRenderer`.
pdfium = ["renderer", "pdfxi-render/pdfium"]

