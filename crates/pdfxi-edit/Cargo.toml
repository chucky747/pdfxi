[package]
name = "pdfxi-edit"
description = "Page operations, content editing, annotations, watermarks, Bates numbering, and redaction."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
pdfxi-core.workspace = true
thiserror.workspace = true
# Image XObject pixel redaction. JPEG decoding only at runtime; the PNG feature
# is used by the deterministic integration tests that build fixtures. Licence:
# MIT OR Apache-2.0, already present in the workspace lock.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[dev-dependencies]
# Renderer-backed proof only: the integration test renders the edited page and
# rejects a solid bar. The `pdfium` feature loads the native library at runtime
# (PDFIUM_PATH in debug builds), so a machine without it fails that one test
# with a clear backend error rather than changing library behaviour.
pdfxi-render = { workspace = true, features = ["pdfium"] }
