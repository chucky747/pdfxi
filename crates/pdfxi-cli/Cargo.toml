[package]
name = "pdfxi-cli"
description = "Headless command-line interface for PDFXI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "pdfxi"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
pdfxi-core = { workspace = true }
# Action-file parsing and the document executor used by `action` and `droplet`.
# A workspace crate, so no external dependency is introduced.
pdfxi-automation = { workspace = true }
pdfxi-text = { workspace = true }
# PDF creation (images, text, Markdown) and tagged/accessible text export used
# by the `create` and `export` command groups. Both are workspace crates, so no
# external dependency is introduced. `default-features = false` keeps the
# optional renderer path out of these headless commands.
pdfxi-convert = { workspace = true }
# Header/footer, watermark and Bates models plus page geometry for the
# decorate command group. A workspace crate, so no new external dependency.
pdfxi-edit = { path = "../pdfxi-edit", version = "0.1.0" }
pdfxi-accessibility = { workspace = true }
# Typed AcroForm field builders and the standalone form serializer used by the
# `form` command group. A workspace crate, so no external dependency.
pdfxi-forms = { workspace = true }
# Headless application models (home, read-aloud, navigation, print plans) used
# by the management and accessibility hosts. Default features exclude the GUI
# stack, so no egui/eframe/winit dependency enters the CLI.
pdfxi-app = { path = "../pdfxi-app", version = "0.1.0" }
# Optional native renderer used only by `pdfxi render`. Default builds keep the
# CLI free of PDFium and still compile the command as a clear error path.
pdfxi-render = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[features]
default = []
# Enable the `render` command's PDFium-backed rasterization.
pdfium = ["dep:pdfxi-render", "pdfxi-render/pdfium"]

[dev-dependencies]
pdfxi-testkit = { workspace = true }
