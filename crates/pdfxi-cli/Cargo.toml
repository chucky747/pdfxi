[package]
name = "pdfxi-cli"
description = "Headless command-line interface for PDFXI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "pdfxi"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
pdfxi-core = { path = "../pdfxi-core" }
pdfxi-text = { path = "../pdfxi-text" }
# Optional native renderer used only by `pdfxi render`. Default builds keep the
# CLI free of PDFium and still compile the command as a clear error path.
pdfxi-render = { path = "../pdfxi-render", optional = true }
serde.workspace = true
serde_json.workspace = true

[features]
default = []
# Enable the `render` command's PDFium-backed rasterization.
pdfium = ["dep:pdfxi-render", "pdfxi-render/pdfium"]

[dev-dependencies]
pdfxi-testkit = { path = "../pdfxi-testkit" }
