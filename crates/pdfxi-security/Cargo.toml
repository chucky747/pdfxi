[package]
name = "pdfxi-security"
description = "Encryption, permissions, digital signatures, certificates, sanitization, and policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
pdfxi-core = { workspace = true }
# Vetted cryptographic primitives for PDF signatures (T-0241). These replace
# the hand-rolled toy RSA path with RustCrypto; all are MIT/Apache-2.0.
cms = { version = "0.2.3", features = ["builder"] }
const-oid = "0.9"
der = "0.7"
# Vetted OS-entropy source for AES-256 file keys and R5/R6 salts (T-0256).
# MIT OR Apache-2.0, already in the workspace lock graph through `rand`.
getrandom = "0.2"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = { version = "0.10", features = ["oid"] }
spki = "0.7"
x509-cert = { version = "0.2", features = ["builder", "pem"] }

[dev-dependencies]
rand = "0.8"

