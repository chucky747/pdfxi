[package]
name = "pdfxi-security"
description = "Encryption, permissions, digital signatures, certificates, sanitization, and policy."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
pdfxi-core = { workspace = true }
# Vetted cryptographic primitives for PDF signatures (T-0241). These replace
# the hand-rolled toy RSA path with RustCrypto; all are MIT/Apache-2.0.
cms = { version = "0.2.3", features = ["builder"] }
const-oid = "0.9"
der = "0.7"
# Vetted OS-entropy source for AES-256 file keys and R5/R6 salts (T-0256).
# MIT OR Apache-2.0, already in the workspace lock graph through `rand`.
getrandom = "0.2"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = { version = "0.10", features = ["oid"] }
spki = "0.7"
x509-cert = { version = "0.2", features = ["builder", "pem"] }

# PKCS#12 identity import (T-0249). No crate in the lock graph parses and
# decrypts PKCS#12, so only the primitives that this crate does not already own
# are added: SHA-1 (PBKDF2-HMAC-SHA1, the PKCS#12 MAC and the Windows
# thumbprint), and 3DES plus the block-cipher traits for legacy PBES1 shrouded
# key bags. All three are RustCrypto, MIT OR Apache-2.0, and already present in
# the workspace lock graph through other tools.
cipher = "0.4"
des = "0.8"
sha1 = "0.10"

# Optional native second reader for the T-0257 sanitize verification test.
# Kept optional so default builds and tests stay dependency-light.
pdfium-render = { version = "0.9.5", optional = true }

[features]
default = []
# Enable the PDFium-backed independent-reader test. Requires a PDFium library
# at runtime (see `PDFIUM_PATH` or the standard per-user install location).
pdfium = ["dep:pdfium-render"]

[lints.cargo]
# `pdfium-render` is intentionally optional and is referenced only by the
# feature-gated `tests/sanitize_pdfium.rs` target, not by the library.
unused_dependencies = "allow"

[dev-dependencies]
rand = "0.8"

