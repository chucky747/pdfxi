# Manifest template for a machine that has `cargo-fuzz` and nightly Rust.
#
# This is intentionally a standalone workspace (it declares `[workspace]`).
# The canonical workspace root `Cargo.toml` is integrator-owned and does NOT
# list `fuzz` as a member, so adding it there would violate the claim boundary.
# On this host `cargo fuzz` is not installed and `libfuzzer-sys` does not
# compile with the installed MinGW g++ or clang (see
# `orchestration/blockers/T-0260A-fuzz-toolchain.md`), so the fast checks do
# not build the libFuzzer runtime.
#
# Plain entry points for the original five targets live in
# `crates/pdfxi-testkit/src/fuzz.rs` with `examples/fuzz_smoke.rs`. The
# `redaction` and `edit` entry points live in the `entry/` member so their
# deterministic seed runner builds and runs without `libfuzzer-sys`; every
# target file is still a thin `fuzz_target!` wrapper around a plain function.

[package]
name = "pdfxi-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
description = "libFuzzer targets for the PDFXI parsers, filters, content streams, forms, crypto, redaction, and edit paths."
license = "MIT OR Apache-2.0"

# This marker is what `cargo fuzz` looks for when locating the fuzz crate.
[package.metadata]
cargo-fuzz = true

[workspace]
members = [".", "entry"]

[dependencies]
libfuzzer-sys = "0.4"
pdfxi-testkit = { path = "../crates/pdfxi-testkit" }
# Plain functions shared with the deterministic seed runner. This path carries
# no `libfuzzer-sys` dependency, so `cargo test` in that member never builds
# the C++ runtime.
pdfxi-fuzz-entry = { path = "entry" }

[[bin]]
name = "parser"
path = "fuzz_targets/parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filters"
path = "fuzz_targets/filters.rs"
test = false
doc = false
bench = false

[[bin]]
name = "content"
path = "fuzz_targets/content.rs"
test = false
doc = false
bench = false

[[bin]]
name = "forms"
path = "fuzz_targets/forms.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crypto"
path = "fuzz_targets/crypto.rs"
test = false
doc = false
bench = false

[[bin]]
name = "redaction"
path = "fuzz_targets/redaction.rs"
test = false
doc = false
bench = false

[[bin]]
name = "edit"
path = "fuzz_targets/edit.rs"
test = false
doc = false
bench = false
